# yaml-language-server: $schema=../schema/site.schema.json
#
# Riverside water treatment plant: the built-in ZoneSim site.
# To make your own, start from sites/templates/my-site.yaml, which extends this
# file and changes only what you need (names, IP addresses, setpoints ...).

schema: zonesim-site/1
id: riverside-water
name: Riverside water treatment plant
description: >
  A small drinking water plant. An inlet pump fills a tank from the river,
  chlorine is dosed into it, and the town draws water out. A PLC keeps the
  level between two setpoints, and an independent safety system stops the
  pump if the level gets too high. It starts on one flat network.

process:
  model: water-tank
  tags:
    source: river
    consumer: town
    tank: T-101
    pump: P-101
    dosing: P-201
  params:
    initialLevel: 55      # %
    inflow: 1.2           # % of the tank per second while the inlet pump runs
    demand: 0.5           # % of the tank per second drawn by the town
    startLevel: 40        # %, default pump start level in auto mode
    stopLevel: 80         # %, default pump stop level in auto mode
    lowAlarm: 20          # %
    highAlarm: 85         # %
    highHighAlarm: 95     # %
    tripLevel: 95         # %, default safety trip level
    tripReset: 80         # %, the safety trip resets below this level
    chlorineSetpoint: 1.5 # mg/L
    chlorineInitial: 1.5  # mg/L
    chlorineLow: 0.5      # mg/L, below this the water may be unsafe
    chlorineHigh: 4.0     # mg/L, above this the plant is overdosing
    chlorineTau: 15       # seconds for the residual to follow the setpoint
    chlorineDecay: 40     # seconds for the residual to decay with dosing off

hosts:
  - { name: vendor-laptop, role: vendor, ip: 203.0.113.50, level: 5, kind: external, services: [], os: Windows 11, user: vendor, description: Remote vendor support laptop }
  - { name: corp-pc, role: office, ip: 10.10.40.21, level: 4, kind: it, services: [rdp], os: Windows 11, user: alice, description: Office workstation (finance) }
  - { name: hist-dmz, role: report-server, ip: 10.10.35.10, level: 3.5, kind: dmz, services: [https], os: Linux, user: svc-report, description: Historian copy for office reports }
  - { name: jump-01, role: jump, ip: 10.10.35.20, level: 3.5, kind: dmz, services: [rdp, ssh], os: Windows Server 2022, user: vendor, description: Remote access jump host }
  - { name: historian, role: historian, ip: 10.10.30.10, level: 3, kind: ot, services: [https, ssh], os: Windows Server 2019, user: svc-hist, description: Process historian }
  - { name: hmi-01, role: hmi, ip: 10.10.20.10, level: 2, kind: ot, services: [http, rdp], os: Windows 10 LTSC, user: operator, description: Operator HMI }
  - { name: ews-01, role: ews, ip: 10.10.20.30, level: 2, kind: ot, services: [rdp], os: Windows 10, user: engineer, description: Engineering workstation }
  - { name: plc-1, role: plc, ip: 10.10.10.10, level: 1, kind: ot, services: [modbus, http], os: "ZS-PLC 100, firmware 2.4.1", description: Tank and dosing PLC }
  - { name: sis-1, role: sis, ip: 10.10.10.20, level: 1, kind: ot, services: [modbus], os: "ZS-SIS 20, firmware 1.8.0", description: Safety instrumented system }

# The network as found: everything on one flat zone, plus a port forward that
# lets the vendor's laptop reach the engineering workstation directly.
zones:
  - { name: internet, description: Everything outside the site, hosts: [vendor-laptop] }
  - name: site
    description: "The whole site network as found: office and plant on one flat network"
    hosts: [corp-pc, hist-dmz, jump-01, historian, hmi-01, ews-01, plc-1, sis-1]

conduits:
  - name: edge
    zones: [internet, site]
    rules:
      - allow from vendor-laptop to ews-01 rdp

# Controllers and their Modbus maps. Each point exposes a process signal.
# Writable switches go in coils, writable numbers in holding registers,
# read-only switches in discrete inputs, read-only numbers in input registers.
devices:
  plc-1:
    title: tank and dosing controller
    vendor: ZoneSim Controls
    product: ZS-PLC 100
    revision: 2.4.1
    points:
      coil:
        - { addr: 0, tag: P101_RUN_CMD, signal: pump.command, description: Inlet pump P-101 run command (used in manual mode only) }
        - { addr: 1, tag: P201_ENABLE, signal: dosing.enable, description: Chlorine dosing pump P-201 enable }
        - { addr: 2, tag: AUTO_MODE, signal: control.auto, description: "1 = automatic level control, 0 = manual" }
      di:
        - { addr: 0, tag: P101_RUNNING, signal: pump.running, description: Inlet pump P-101 is running }
        - { addr: 1, tag: P201_RUNNING, signal: dosing.running, description: Dosing pump P-201 is running }
        - { addr: 2, tag: LAH_101, signal: alarm.high, description: Tank level high alarm }
        - { addr: 3, tag: LAL_101, signal: alarm.low, description: Tank level low alarm }
        - { addr: 4, tag: OVERFLOW, signal: alarm.overflow, description: Tank T-101 is overflowing }
      ir:
        - { addr: 0, tag: LT_101, signal: level, description: Tank T-101 level, units: "tenths of a %, 623 = 62.3 %" }
        - { addr: 1, tag: AIT_201, signal: chlorine, description: Chlorine residual, units: "hundredths of mg/L, 150 = 1.50 mg/L" }
      hr:
        - { addr: 0, tag: LSP_START, signal: setpoint.start, description: Pump start level in auto mode, units: tenths of a % }
        - { addr: 1, tag: LSP_STOP, signal: setpoint.stop, description: Pump stop level in auto mode, units: tenths of a % }
        - { addr: 2, tag: CL_SETPOINT, signal: setpoint.chlorine, description: Chlorine dosing setpoint, units: hundredths of mg/L }
  sis-1:
    title: safety instrumented system
    vendor: ZoneSim Controls
    product: ZS-SIS 20
    revision: 1.8.0
    points:
      coil:
        - { addr: 0, tag: HH_BYPASS, signal: sis.bypass, description: "Maintenance bypass of the high-high level trip (1 = bypassed)" }
      di:
        - { addr: 0, tag: TRIP_ACTIVE, signal: sis.tripped, description: "High-high trip active, inlet pump held off" }
        - { addr: 1, tag: BYPASS_ACTIVE, signal: sis.bypassed, description: High-high trip is bypassed }
      ir:
        - { addr: 0, tag: LT_102, signal: sis.level, description: Independent tank level transmitter, units: tenths of a % }
      hr:
        - { addr: 0, tag: LSHH_SP, signal: sis.trip_level, description: High-high trip level, units: tenths of a % }

# What the operator screen shows, and where it gets its data.
hmi:
  host: hmi-01
  device: plc-1
  timeout: 6   # seconds without data before the HMI shows COMM FAIL

# Traffic the plant generates by itself.
polling:
  - { from: hmi-01, to: plc-1, service: modbus, fc: [3, 4], every: 2 }
  - { from: hmi-01, to: sis-1, service: modbus, fc: [2], every: 5 }
  - { from: historian, to: plc-1, service: modbus, fc: [4], every: 5 }
  - { from: historian, to: sis-1, service: modbus, fc: [4], every: 10 }
  - { from: historian, to: hist-dmz, service: https, every: 10 }
  - { from: corp-pc, to: hist-dmz, service: https, every: 30 }

# Data flows the plant needs. Blocking one breaks something.
flows:
  - { id: hmi-plc, why: Operators watch and control the process from the HMI., from: hmi-01, to: plc-1, service: modbus, fc: [1, 2, 3, 4, 5, 6] }
  - { id: hmi-sis, why: Operators see the safety system status on the HMI., from: hmi-01, to: sis-1, service: modbus, fc: [2, 4] }
  - { id: historian-plc, why: The historian records the process values., from: historian, to: plc-1, service: modbus, fc: [3, 4] }
  - { id: historian-sis, why: The historian records the safety system values., from: historian, to: sis-1, service: modbus, fc: [2, 4] }
  - { id: ews-plc, why: Engineers maintain the PLC settings from the engineering workstation., from: ews-01, to: plc-1, service: modbus, fc: [1, 2, 3, 4, 5, 6, 15, 16, 43] }
  - { id: historian-replica, why: The historian copies data to the DMZ so the office never touches the plant., from: historian, to: hist-dmz, service: https }
  - { id: office-reports, why: Office staff read production reports from the DMZ copy., from: corp-pc, to: hist-dmz, service: https }
  - id: vendor-support
    why: The vendor supports the plant remotely, directly or through the jump host.
    paths:
      - [{ from: vendor-laptop, to: jump-01, service: rdp }, { from: jump-01, to: ews-01, service: rdp }]
      - [{ from: vendor-laptop, to: ews-01, service: rdp }]

# What the IDS sensor considers normal.
ids:
  writers:
    plc-1: [hmi-01, ews-01]
  safety: [sis-1]          # any write to these is critical
  identify: [ews-01]       # hosts allowed to read device identification
