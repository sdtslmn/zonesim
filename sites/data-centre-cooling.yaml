# yaml-language-server: $schema=../schema/site.schema.json
#
# Harbour data centre: a built-in ZoneSim site. The cooling and power
# monitoring of one data hall: two chillers (one a spare), chilled water
# pumps, CRAH units, a power meter gateway and the fire suppression panel.
# Colocation customers see their dashboards on a portal, and the chiller
# vendor supports the plant remotely.

schema: zonesim-site/1
id: data-centre-cooling
name: Harbour data centre
description: >-
  Cooling and power monitoring for Data hall 1 (1.2 MW of IT). Chiller plant
  controller cpc-1 runs chillers CH-1 and CH-2 (N+1), the pumps and the CRAH
  setpoints. Power meter gateway pm-1 reports IT load and PUE. Fire panel fp-1
  is the life safety system. The BMS and DCIM watch it all, customers read a
  portal, the chiller vendor reaches the BMS from the internet, and it all
  starts on one flat network.

process:
  model: dc-cooling
  tags:
    hall: Data hall 1
    chiller1: CH-1
    chiller2: CH-2
    pump: CHWP-1
    crah: CRAH units
    agent: clean agent
  params:
    itLoad: 1200            # kW
    chillerCapacity: 1500   # kW each; one chiller carries the hall, the other is the spare
    chwSetpoint: 14         # °C
    supplyAirSetpoint: 24   # °C
    approach: 8             # K
    recommendedMax: 27      # °C, ASHRAE recommended range for server inlets
    allowableMax: 32        # °C, ASHRAE class A1 allowable
    shutdownTemp: 35        # °C, servers turn themselves off
    warmingRate: 2          # °C per minute with no cooling
    chwRate: 1              # °C per minute with no chiller
    shutdownLoad: 30        # % of IT load left after a thermal shutdown

hosts:
  - { name: chiller-vendor, role: vendor, ip: 198.51.100.77, level: 5, kind: external, services: [], os: Windows 11, user: vendor, description: Chiller vendor remote support }
  - { name: customer, role: customer, ip: 203.0.113.80, level: 5, kind: external, services: [], os: macOS, user: tenant, description: Colocation customer reading dashboards }
  - { name: corp-pc, role: office, ip: 10.50.40.21, level: 4, kind: it, services: [rdp], os: Windows 11, user: lina, description: Facilities office PC }
  - { name: portal, role: report-server, ip: 10.50.35.10, level: 3.5, kind: dmz, services: [https], os: Linux, user: svc-portal, description: Customer portal (copy of DCIM data) }
  - { name: jump-01, role: jump, ip: 10.50.35.20, level: 3.5, kind: dmz, services: [rdp, ssh], os: Windows Server 2022, user: vendor, description: Remote access jump host }
  - { name: dcim-01, role: historian, ip: 10.50.30.10, level: 3, kind: ot, services: [https, ssh], os: Linux, user: svc-dcim, description: DCIM server (monitoring and history) }
  - { name: bms-01, role: hmi, ip: 10.50.20.10, level: 2, kind: ot, services: [http, rdp], os: Windows 10 LTSC, user: operator, description: BMS operator workstation }
  - { name: ews-01, role: ews, ip: 10.50.20.30, level: 2, kind: ot, services: [rdp], os: Windows 10, user: engineer, description: Controls engineering workstation }
  - { name: cpc-1, role: plc, ip: 10.50.10.10, level: 1, kind: ot, services: [modbus, http], os: "HC-CPC 2, firmware 4.7.1", description: Chiller plant controller }
  - { name: fp-1, role: sis, ip: 10.50.10.20, level: 1, kind: ot, services: [modbus], os: "HC-FP 8, firmware 6.0.2", description: Fire alarm and suppression panel (life safety) }
  - { name: pm-1, role: meter, ip: 10.50.10.30, level: 1, kind: ot, services: [modbus], os: "HC-PM 5, firmware 1.9.0", description: Power meter gateway (EPMS) }

# As found: one flat network, and the chiller vendor's remote desktop
# forwarded straight to the BMS workstation.
zones:
  - { name: internet, description: Everything outside the data centre, hosts: [chiller-vendor, customer] }
  - name: site
    description: "The whole facility network as found: office, BMS and controllers on one flat network"
    hosts: [corp-pc, portal, jump-01, dcim-01, bms-01, ews-01, cpc-1, fp-1, pm-1]

conduits:
  - name: edge
    zones: [internet, site]
    rules:
      - allow from chiller-vendor to bms-01 rdp
      - allow from customer to portal https

devices:
  cpc-1:
    title: chiller plant controller
    vendor: Harbour Controls
    product: HC-CPC 2
    revision: 4.7.1
    points:
      coil:
        - { addr: 0, tag: CH1_ENABLE, signal: chiller1.enable, description: Chiller CH-1 available for duty }
        - { addr: 1, tag: CH2_ENABLE, signal: chiller2.enable, description: Chiller CH-2 available for duty }
        - { addr: 2, tag: CHWP1_RUN, signal: pump.run, description: Chilled water pumps run command }
        - { addr: 3, tag: PLANT_AUTO, signal: control.auto, description: "1 = auto, N+1 chiller sequencing" }
      di:
        - { addr: 0, tag: CH1_RUNNING, signal: chiller1.running, description: Chiller CH-1 running }
        - { addr: 1, tag: CH2_RUNNING, signal: chiller2.running, description: Chiller CH-2 running }
        - { addr: 2, tag: CHWP1_RUNNING, signal: pump.running, description: Chilled water pumps running }
        - { addr: 3, tag: TAH_AISLE, signal: alarm.high_temp, description: Cold aisle above recommended }
        - { addr: 4, tag: TAHH_AISLE, signal: alarm.critical_temp, description: Cold aisle above allowable }
      ir:
        - { addr: 0, tag: TT_CHWS, signal: temp.chw_supply, description: Chilled water supply temperature, units: "tenths of a °C, 140 = 14.0 °C" }
        - { addr: 1, tag: TT_AISLE, signal: temp.cold_aisle, description: Cold aisle temperature, units: "tenths of a °C" }
      hr:
        - { addr: 0, tag: CHWS_SP, signal: setpoint.chw, description: Chilled water supply setpoint, units: tenths of a °C }
        - { addr: 1, tag: SAT_SP, signal: setpoint.supply_air, description: CRAH supply air setpoint, units: tenths of a °C }
  fp-1:
    title: fire alarm and suppression panel
    vendor: Harbour Controls
    product: HC-FP 8
    revision: 6.0.2
    points:
      coil:
        - { addr: 0, tag: Z1_ISOLATE, signal: fire.isolate, description: "Isolate the Data hall 1 suppression release (1 = isolated)" }
        - { addr: 1, tag: Z1_MAN_RELEASE, signal: fire.release, description: "Manual release of the clean agent in Data hall 1" }
      di:
        - { addr: 0, tag: Z1_ISOLATED, signal: fire.isolated, description: Suppression release isolated }
        - { addr: 1, tag: Z1_FIRE, signal: fire.alarm, description: Fire alarm active }
        - { addr: 2, tag: Z1_DISCHARGED, signal: fire.discharged, description: Clean agent released }
      ir:
        - { addr: 0, tag: Z1_HEAT, signal: fire.temp, description: Hall temperature at the heat detectors, units: tenths of a °C }
  pm-1:
    title: power meter gateway
    vendor: Harbour Controls
    product: HC-PM 5
    revision: 1.9.0
    points:
      ir:
        - { addr: 0, tag: IT_KW, signal: load.it, description: IT load, units: kW }
        - { addr: 1, tag: COOL_KW, signal: power.cooling, description: Cooling power, units: kW }
        - { addr: 2, tag: PUE, signal: pue, description: Power usage effectiveness, units: "hundredths, 135 = 1.35" }

hmi:
  host: bms-01
  device: cpc-1
  timeout: 6

polling:
  - { from: bms-01, to: cpc-1, service: modbus, fc: [3, 4], every: 2 }
  - { from: bms-01, to: fp-1, service: modbus, fc: [2], every: 5 }
  - { from: bms-01, to: pm-1, service: modbus, fc: [4], every: 5 }
  - { from: dcim-01, to: cpc-1, service: modbus, fc: [4], every: 5 }
  - { from: dcim-01, to: pm-1, service: modbus, fc: [4], every: 5 }
  - { from: dcim-01, to: fp-1, service: modbus, fc: [2], every: 10 }
  - { from: dcim-01, to: portal, service: https, every: 10 }
  - { from: customer, to: portal, service: https, every: 30 }
  - { from: corp-pc, to: portal, service: https, every: 30 }

flows:
  - { id: bms-plc, why: Operators run the chiller plant from the BMS., from: bms-01, to: cpc-1, service: modbus, fc: [1, 2, 3, 4, 5, 6] }
  - { id: bms-fire, why: The BMS shows the fire panel status., from: bms-01, to: fp-1, service: modbus, fc: [2, 4] }
  - { id: bms-power, why: The BMS shows IT load and PUE., from: bms-01, to: pm-1, service: modbus, fc: [4] }
  - { id: dcim-plc, why: The DCIM records temperatures and chiller states., from: dcim-01, to: cpc-1, service: modbus, fc: [3, 4] }
  - { id: dcim-power, why: The DCIM records power for capacity planning and billing., from: dcim-01, to: pm-1, service: modbus, fc: [4] }
  - { id: dcim-fire, why: The DCIM records fire panel events., from: dcim-01, to: fp-1, service: modbus, fc: [2, 4] }
  - { id: ews-plc, why: Engineers maintain the chiller plant controller., from: ews-01, to: cpc-1, service: modbus, fc: [1, 2, 3, 4, 5, 6, 15, 16, 43] }
  - { id: dcim-portal, why: The DCIM copies customer data to the portal in the DMZ., from: dcim-01, to: portal, service: https }
  - { id: customer-portal, why: Customers check their power and temperatures on the portal., from: customer, to: portal, service: https }
  - { id: office-reports, why: Facilities staff read reports from the portal., from: corp-pc, to: portal, service: https }
  - id: vendor-support
    why: The chiller vendor supports the plant remotely, directly or through the jump host.
    paths:
      - [{ from: chiller-vendor, to: jump-01, service: rdp }, { from: jump-01, to: bms-01, service: rdp }]
      - [{ from: chiller-vendor, to: bms-01, service: rdp }]

ids:
  writers:
    cpc-1: [bms-01, ews-01]
  safety: [fp-1]
  identify: [ews-01]
