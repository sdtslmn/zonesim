# yaml-language-server: $schema=../schema/site.schema.json
#
# Kestrel compressor station: a built-in ZoneSim site. A pipeline compressor
# station boosts gas from the upstream line into the downstream line. The
# pipeline control centre monitors and controls it over a WAN link, the
# compressor maker supports it remotely, and a flow computer measures the gas
# sold downstream.

schema: zonesim-site/1
id: gas-compressor-station
name: Kestrel compressor station
description: >-
  A pipeline compressor station. Unit PLC ucp-1 runs compressor K-101 to hold
  the discharge pressure and keeps it out of surge with the recycle valve. The
  ESD system esd-1 trips the compressor and closes the station valve on
  high-high pressure. Flow computer fc-1 measures the gas sold. The pipeline
  control centre reaches the station over a WAN, the compressor maker over the
  internet, and it all starts on one flat station network.

process:
  model: gas-compressor
  tags:
    compressor: K-101
    recycle: UV-101
    esd: SDV-102
    relief: PSV-103
    meter: FQ-104
    source: upstream line
    consumer: downstream line
  params:
    suctionPressure: 40   # bar
    headMax: 70           # bar the compressor adds at full speed and no flow
    setpoint: 65          # bar, default discharge pressure setpoint
    demand: 35            # % of design flow taken downstream
    designFlow: 400       # thousand Sm³/h
    lowAlarm: 50          # bar
    highAlarm: 70         # bar
    tripPressure: 75      # bar, PSHH on the ESD system
    tripReset: 68         # bar
    reliefPressure: 80    # bar, PSV-103
    surgeLine: 55         # %
    surgeMargin: 15       # %
    pressureRate: 0.5
    speedRate: 2
    vibrationTrip: 10     # seconds of surge before machine protection trips

hosts:
  - { name: oem-remote, role: vendor, ip: 198.51.100.20, level: 5, kind: external, services: [], os: Windows 11, user: oem, description: Compressor maker's remote monitoring and support }
  - { name: occ-scada, role: control-centre, ip: 10.20.0.10, level: 3, kind: ot, services: [https], os: Linux, user: dispatcher, description: "Pipeline control centre SCADA, 300 km away over the WAN" }
  - { name: corp-pc, role: office, ip: 172.16.40.21, level: 4, kind: it, services: [rdp], os: Windows 11, user: omar, description: Station office PC }
  - { name: hist-dmz, role: report-server, ip: 172.16.35.10, level: 3.5, kind: dmz, services: [https], os: Linux, user: svc-report, description: Historian copy for office and compressor maker reports }
  - { name: jump-01, role: jump, ip: 172.16.35.20, level: 3.5, kind: dmz, services: [rdp, ssh], os: Windows Server 2022, user: vendor, description: Remote access jump host }
  - { name: historian, role: historian, ip: 172.16.30.10, level: 3, kind: ot, services: [https, ssh], os: Windows Server 2019, user: svc-hist, description: Station historian }
  - { name: hmi-1, role: hmi, ip: 172.16.20.10, level: 2, kind: ot, services: [http, rdp], os: Windows 10 LTSC, user: operator, description: Station operator HMI }
  - { name: ews-1, role: ews, ip: 172.16.20.30, level: 2, kind: ot, services: [rdp], os: Windows 10, user: engineer, description: Engineering workstation }
  - { name: ucp-1, role: plc, ip: 172.16.10.10, level: 1, kind: ot, services: [modbus, http], os: "KS-UCP 300, firmware 5.2.3", description: Compressor unit control PLC }
  - { name: esd-1, role: sis, ip: 172.16.10.20, level: 1, kind: ot, services: [modbus], os: "KS-ESD 40, firmware 2.1.0", description: Emergency shutdown system (SIS) }
  - { name: fc-1, role: meter, ip: 172.16.10.30, level: 1, kind: ot, services: [modbus], os: "KS-FC 10, firmware 3.0.4", description: Gas flow computer (fiscal metering) }

# As found: everything at the station on one network, the WAN link open to it
# all, and a port forward for the compressor maker.
zones:
  - { name: internet, description: Everything outside the company, hosts: [oem-remote] }
  - { name: wan, port: wan2, description: The pipeline control centre across the company WAN, hosts: [occ-scada] }
  - name: station
    description: "The whole station network as found: office and plant on one flat network"
    hosts: [corp-pc, hist-dmz, jump-01, historian, hmi-1, ews-1, ucp-1, esd-1, fc-1]

conduits:
  - name: edge
    zones: [internet, station]
    rules:
      - allow from oem-remote to ews-1 rdp
      - allow from oem-remote to hist-dmz https
  - name: wan-link
    zones: [wan, station]
    rules:
      - allow from occ-scada to station any

# The station firewall and two switches: a Cisco switch in the office and
# server room, and a Hirschmann switch in the control room cabinet. Outside
# links come in on firewall ports (internet on wan1, the company WAN on wan2).
network:
  firewall: { name: fw-01, vendor: fortinet, model: FortiGate Rugged 60F, firmware: v7.4.4, hostname: FGR60F-KESTREL, ip: 192.168.250.1 }
  switches:
    - name: sw-office
      vendor: cisco
      model: IE-3400
      firmware: 17.9.4
      hostname: SW-KESTREL-OFFICE
      ip: 192.168.250.11
      ports: { Gi1/1: corp-pc, Gi1/2: hist-dmz, Gi1/3: jump-01, Gi1/4: historian, Gi1/5: null, Gi1/6: null }
    - name: sw-plant
      vendor: hirschmann
      model: RSP35
      firmware: 09.4.03
      hostname: SW-KESTREL-PLANT
      ip: 192.168.250.12
      ports: { "1/1": hmi-1, "1/2": ews-1, "1/3": ucp-1, "1/4": esd-1, "1/5": fc-1, "1/6": null, "1/7": null }

devices:
  ucp-1:
    title: compressor unit controller
    vendor: Kestrel Controls
    product: KS-UCP 300
    revision: 5.2.3
    points:
      coil:
        - { addr: 0, tag: K101_RUN_CMD, signal: compressor.run, description: Compressor K-101 run command }
        - { addr: 1, tag: PIC101_AUTO, signal: control.auto, description: "1 = speed holds the discharge pressure, 0 = manual speed" }
        - { addr: 2, tag: UIC101_AUTO, signal: antisurge.auto, description: "1 = anti-surge controller in auto" }
      di:
        - { addr: 0, tag: K101_RUNNING, signal: compressor.running, description: Compressor K-101 is running }
        - { addr: 1, tag: UA101_SURGE, signal: alarm.surge, description: Compressor in surge }
        - { addr: 2, tag: PAH101, signal: alarm.high_pressure, description: Discharge pressure high }
        - { addr: 3, tag: PSV103_OPEN, signal: alarm.venting, description: Relief valve PSV-103 lifting }
      ir:
        - { addr: 0, tag: PT100, signal: pressure.suction, description: Suction pressure, units: "tenths of a bar, 400 = 40.0 bar" }
        - { addr: 1, tag: PT101, signal: pressure.discharge, description: Discharge pressure, units: "tenths of a bar, 650 = 65.0 bar" }
        - { addr: 2, tag: SI101, signal: speed, description: Compressor speed, units: "tenths of a %" }
        - { addr: 3, tag: ZI101, signal: recycle, description: Anti-surge valve UV-101 position, units: "tenths of a %" }
        - { addr: 4, tag: FI101, signal: flow, description: Station flow, units: "thousand Sm³/h" }
        - { addr: 5, tag: UI101_MARGIN, signal: surge.margin, description: Surge margin, units: "% (0 in surge)" }
      hr:
        - { addr: 0, tag: PIC101_SP, signal: setpoint.discharge, description: Discharge pressure setpoint, units: tenths of a bar }
        - { addr: 1, tag: SIC101_MAN, signal: setpoint.speed, description: Manual speed, units: tenths of a % }
        - { addr: 2, tag: UIC101_MAN, signal: setpoint.recycle, description: Manual anti-surge valve position, units: tenths of a % }
  esd-1:
    title: emergency shutdown system
    vendor: Kestrel Controls
    product: KS-ESD 40
    revision: 2.1.0
    points:
      coil:
        - { addr: 0, tag: PSHH102_BYP, signal: sis.bypass, description: "Maintenance bypass of the high-high pressure trip (1 = bypassed)" }
      di:
        - { addr: 0, tag: ESD_TRIPPED, signal: sis.tripped, description: "High-high trip active: K-101 stopped, SDV-102 closed" }
        - { addr: 1, tag: PSHH102_BYPASSED, signal: sis.bypassed, description: High-high trip is bypassed }
        - { addr: 2, tag: SDV102_CLOSED, signal: valve.esd_closed, description: Station valve SDV-102 closed }
      ir:
        - { addr: 0, tag: PT102, signal: sis.pressure, description: Independent discharge pressure transmitter, units: tenths of a bar }
      hr:
        - { addr: 0, tag: PSHH102_SP, signal: sis.trip_pressure, description: High-high trip pressure, units: tenths of a bar }
  fc-1:
    title: gas flow computer
    vendor: Kestrel Controls
    product: KS-FC 10
    revision: 3.0.4
    points:
      ir:
        - { addr: 0, tag: FQ104_FLOW, signal: meter.flow, description: Metered flow, units: "thousand Sm³/h" }
        - { addr: 1, tag: FQ104_PRESS, signal: pressure.discharge, description: Line pressure at the meter, units: tenths of a bar }
      hr:
        - { addr: 0, tag: FQ104_MF, signal: meter.factor, description: "Meter factor, 10000 = 1.0000 (set at calibration)" }

hmi:
  host: hmi-1
  device: ucp-1
  timeout: 6

polling:
  - { from: hmi-1, to: ucp-1, service: modbus, fc: [3, 4], every: 2 }
  - { from: hmi-1, to: esd-1, service: modbus, fc: [2], every: 5 }
  - { from: historian, to: ucp-1, service: modbus, fc: [4], every: 5 }
  - { from: historian, to: esd-1, service: modbus, fc: [4], every: 10 }
  - { from: historian, to: fc-1, service: modbus, fc: [4], every: 10 }
  - { from: occ-scada, to: ucp-1, service: modbus, fc: [3, 4], every: 5 }
  - { from: occ-scada, to: fc-1, service: modbus, fc: [4], every: 10 }
  - { from: historian, to: hist-dmz, service: https, every: 10 }
  - { from: corp-pc, to: hist-dmz, service: https, every: 30 }
  - { from: oem-remote, to: hist-dmz, service: https, every: 60 }

flows:
  - { id: hmi-plc, why: Operators run the compressor from the station HMI., from: hmi-1, to: ucp-1, service: modbus, fc: [1, 2, 3, 4, 5, 6] }
  - { id: hmi-sis, why: Operators see the ESD status on the HMI., from: hmi-1, to: esd-1, service: modbus, fc: [2, 4] }
  - { id: historian-plc, why: The historian records the compressor values., from: historian, to: ucp-1, service: modbus, fc: [3, 4] }
  - { id: historian-sis, why: The historian records the ESD values., from: historian, to: esd-1, service: modbus, fc: [2, 4] }
  - { id: historian-meter, why: The historian records the metered flow., from: historian, to: fc-1, service: modbus, fc: [3, 4] }
  - { id: ews-plc, why: Engineers maintain the unit PLC., from: ews-1, to: ucp-1, service: modbus, fc: [1, 2, 3, 4, 5, 6, 15, 16, 43] }
  - { id: ews-meter, why: Engineers calibrate the flow computer., from: ews-1, to: fc-1, service: modbus, fc: [3, 4, 6, 43] }
  - { id: occ-plc, why: "The control centre watches the station and starts, stops and sets it remotely.", from: occ-scada, to: ucp-1, service: modbus, fc: [3, 4, 5, 6] }
  - { id: occ-meter, why: The control centre reads the metered flow for gas accounting., from: occ-scada, to: fc-1, service: modbus, fc: [3, 4] }
  - { id: historian-replica, why: The historian copies data to the DMZ so outsiders never touch the plant., from: historian, to: hist-dmz, service: https }
  - { id: office-reports, why: Office staff read station reports from the DMZ copy., from: corp-pc, to: hist-dmz, service: https }
  - { id: oem-monitoring, why: The compressor maker watches machine health from the DMZ copy., from: oem-remote, to: hist-dmz, service: https }
  - id: vendor-support
    why: The compressor maker logs in for support, directly or through the jump host.
    paths:
      - [{ from: oem-remote, to: jump-01, service: rdp }, { from: jump-01, to: ews-1, service: rdp }]
      - [{ from: oem-remote, to: ews-1, service: rdp }]

ids:
  writers:
    ucp-1: [hmi-1, ews-1, occ-scada]
    fc-1: [ews-1]
  safety: [esd-1]
  identify: [ews-1]
