# yaml-language-server: $schema=../schema/site.schema.json
#
# Meridian Line metro: a built-in ZoneSim site. One section of a metro line:
# a traction power substation that feeds the third rail, the tunnel
# ventilation system, and the emergency trip system that keeps the power off
# while a crew works on the track. The operations control centre (OCC) and
# the backup OCC run it over the metro WAN, the traction power maker supports
# it remotely, and the station network starts flat.

schema: zonesim-site/1
id: metro-line
name: Meridian Line metro
description: >-
  A metro line section. Traction power controller tps-1 closes feeder breaker
  CB-11 to put 750 V on the third rail and trips it on overcurrent. Tunnel
  ventilation controller tvc-1 runs the tunnel fans and has a fire mode. The
  emergency trip system ets-1 holds the power off while a crew is on the
  track. The OCC and the backup OCC reach the station over the metro WAN, the
  traction power maker over the internet, and it all starts on one flat
  station network.

process:
  model: metro-line
  tags:
    line: Meridian Line
    substation: TPSS-1
    rectifier: RECT-1
    feeder: CB-11
    fan1: TVF-1
    fan2: TVF-2
    tunnel: Central to Quay tunnel
  params:
    trains: 6              # trains in service on the section
    lineVoltage: 750       # V DC, third rail
    trainCurrent: 400      # A per moving train, on average
    overcurrent: 5000      # A, default feeder trip setting
    etsTrip: 9000          # A, emergency trip system backup trip
    faultCurrent: 12000    # A, a short circuit on the line
    tunnelShare: 67        # % of the trains in the tunnel at any time
    ambient: 26            # °C, tunnel with no trains
    fanStart: 30           # °C, the first tunnel fan starts
    hotAlarm: 35           # °C
    heatStress: 40         # °C, passengers in a stranded train at risk
    possessionTime: 1800   # s a work crew stays on the track

hosts:
  - { name: rail-vendor, role: vendor, ip: 198.51.100.40, level: 5, kind: external, services: [], os: Windows 11, user: vendor, description: Traction power maker's remote support }
  - { name: occ-scada, role: control-centre, ip: 10.30.0.10, level: 3, kind: ot, services: [https], os: Linux, user: controller, description: "Operations control centre SCADA, 12 km away over the metro WAN" }
  - { name: bocc-scada, role: backup-centre, ip: 10.30.8.10, level: 3, kind: ot, services: [https], os: Linux, user: controller, description: "Backup operations control centre SCADA, on hot standby" }
  - { name: corp-pc, role: office, ip: 172.20.40.21, level: 4, kind: it, services: [rdp], os: Windows 11, user: nadia, description: Station office PC }
  - { name: hist-dmz, role: report-server, ip: 172.20.35.10, level: 3.5, kind: dmz, services: [https], os: Linux, user: svc-report, description: Historian copy for maintenance reports }
  - { name: jump-01, role: jump, ip: 172.20.35.20, level: 3.5, kind: dmz, services: [rdp, ssh], os: Windows Server 2022, user: vendor, description: Remote access jump host }
  - { name: historian, role: historian, ip: 172.20.30.10, level: 3, kind: ot, services: [https, ssh], os: Windows Server 2019, user: svc-hist, description: Station historian }
  - { name: scr-1, role: hmi, ip: 172.20.20.10, level: 2, kind: ot, services: [http, rdp], os: Windows 10 LTSC, user: operator, description: Station control room workstation }
  - { name: ews-1, role: ews, ip: 172.20.20.30, level: 2, kind: ot, services: [rdp], os: Windows 10, user: engineer, description: Engineering workstation }
  - { name: tps-1, role: plc, ip: 172.20.10.10, level: 1, kind: ot, services: [modbus, http], os: "VT-PCS 500, firmware 3.2.0", description: Traction power substation controller }
  - { name: tvc-1, role: tvs, ip: 172.20.10.20, level: 1, kind: ot, services: [modbus], os: "AC-TVS 20, firmware 2.6.1", description: Tunnel ventilation controller }
  - { name: ets-1, role: sis, ip: 172.20.10.30, level: 1, kind: ot, services: [modbus], os: "VT-ETS 10, firmware 1.4.2", description: Emergency trip system (traction power safety) }

# As found: everything at the station on one network, the WAN link open to it
# all, and a port forward for the traction power maker.
zones:
  - { name: internet, description: Everything outside the metro, hosts: [rail-vendor] }
  - { name: wan, port: wan2, description: The OCC and the backup OCC across the metro WAN, hosts: [occ-scada, bocc-scada] }
  - name: station
    description: "The whole station network as found: office, control room and controllers on one flat network"
    hosts: [corp-pc, hist-dmz, jump-01, historian, scr-1, ews-1, tps-1, tvc-1, ets-1]

conduits:
  - name: edge
    zones: [internet, station]
    rules:
      - allow from rail-vendor to ews-1 rdp
  - name: wan-link
    zones: [wan, station]
    rules:
      - allow from wan to station any

# The station firewall and two switches: a Cisco switch in the station office
# and server room, and a Hirschmann switch in the control room and
# substation. The OCC link comes in on firewall port wan2.
network:
  firewall: { name: fw-01, vendor: fortinet, model: FortiGate Rugged 60F, firmware: v7.4.4, hostname: FGR60F-MERIDIAN, ip: 192.168.250.1 }
  switches:
    - name: sw-office
      vendor: cisco
      model: IE-3400
      firmware: 17.9.4
      hostname: SW-MERIDIAN-OFFICE
      ip: 192.168.250.11
      ports: { Gi1/1: corp-pc, Gi1/2: hist-dmz, Gi1/3: jump-01, Gi1/4: historian, Gi1/5: null, Gi1/6: null }
    - name: sw-station
      vendor: hirschmann
      model: RSP35
      firmware: 09.4.03
      hostname: SW-MERIDIAN-SCR
      ip: 192.168.250.12
      ports: { "1/1": scr-1, "1/2": ews-1, "1/3": tps-1, "1/4": tvc-1, "1/5": ets-1, "1/6": null, "1/7": null }

devices:
  tps-1:
    title: traction power controller
    vendor: Voltline Traction
    product: VT-PCS 500
    revision: 3.2.0
    points:
      coil:
        - { addr: 0, tag: CB11_CLOSE, signal: feeder.command, description: "Feeder breaker CB-11 close command (1 = energize the line)" }
        - { addr: 1, tag: RECT1_ENABLE, signal: rectifier.enable, description: Rectifier RECT-1 on }
        - { addr: 2, tag: CB11_AUTO_RECLOSE, signal: control.auto, description: "1 = reclose CB-11 once after a protection trip" }
        - { addr: 3, tag: PSN_REGISTERED, signal: possession, description: "Work possession registered: crew on the track, CB-11 held open" }
      di:
        - { addr: 0, tag: CB11_CLOSED, signal: feeder.closed, description: Feeder breaker CB-11 closed }
        - { addr: 1, tag: RECT1_RUNNING, signal: rectifier.running, description: Rectifier RECT-1 running }
        - { addr: 2, tag: CB11_OC_TRIP, signal: alarm.trip, description: CB-11 tripped on overcurrent }
      ir:
        - { addr: 0, tag: VT_LINE, signal: voltage.line, description: Line voltage, units: V }
        - { addr: 1, tag: IT_CB11, signal: current.feeder, description: Feeder current, units: A }
        - { addr: 2, tag: TRAINS_MOVING, signal: trains.moving, description: Trains moving on the section }
        - { addr: 3, tag: TRAINS_STOPPED, signal: trains.stranded, description: Trains stopped in the tunnel }
      hr:
        - { addr: 0, tag: CB11_OC_SP, signal: setpoint.overcurrent, description: CB-11 overcurrent trip setting, units: A }
  tvc-1:
    title: tunnel ventilation controller
    vendor: Aircourse Systems
    product: AC-TVS 20
    revision: 2.6.1
    points:
      coil:
        - { addr: 0, tag: TVF1_RUN, signal: fan1.run, description: Tunnel fan TVF-1 run command (manual mode only) }
        - { addr: 1, tag: TVF2_RUN, signal: fan2.run, description: Tunnel fan TVF-2 run command (manual mode only) }
        - { addr: 2, tag: TVS_AUTO, signal: vent.auto, description: "1 = fans start on tunnel temperature, 0 = manual" }
        - { addr: 3, tag: FIRE_MODE, signal: fire.mode, description: "Fire mode: both fans at full, trains held at stations" }
      di:
        - { addr: 0, tag: TVF1_RUNNING, signal: fan1.running, description: Tunnel fan TVF-1 running }
        - { addr: 1, tag: TVF2_RUNNING, signal: fan2.running, description: Tunnel fan TVF-2 running }
        - { addr: 2, tag: TAH_TUNNEL, signal: alarm.tunnel_hot, description: Tunnel temperature high }
        - { addr: 3, tag: FIRE_MODE_ON, signal: fire.mode_active, description: Fire mode active }
      ir:
        - { addr: 0, tag: TT_TUNNEL, signal: temp.tunnel, description: Tunnel temperature, units: tenths of a °C }
      hr:
        - { addr: 0, tag: TVF_START_SP, signal: setpoint.fan_start, description: Tunnel temperature at which TVF-1 starts, units: tenths of a °C }
  ets-1:
    title: emergency trip system
    vendor: Voltline Traction
    product: VT-ETS 10
    revision: 1.4.2
    points:
      coil:
        - { addr: 0, tag: ETS_BYPASS, signal: sis.bypass, description: Emergency trip bypass (commissioning only) }
      di:
        - { addr: 0, tag: ETS_TRIPPED, signal: sis.tripped, description: "Emergency trip active: rectifier held off" }
        - { addr: 1, tag: ETS_BYPASSED, signal: sis.bypassed, description: Emergency trip bypassed }
        - { addr: 2, tag: PSN_KEY, signal: crew.on_track, description: "Possession key switch: a crew is on the track" }
      ir:
        - { addr: 0, tag: IT_ETS, signal: sis.current, description: Independent feeder current measurement, units: A }
      hr:
        - { addr: 0, tag: ETS_OC_SP, signal: sis.trip_current, description: Backup overcurrent trip, units: A }

hmi:
  host: scr-1
  device: tps-1
  timeout: 6

polling:
  - { from: scr-1, to: tps-1, service: modbus, fc: [3, 4], every: 2 }
  - { from: scr-1, to: tvc-1, service: modbus, fc: [3, 4], every: 2 }
  - { from: scr-1, to: ets-1, service: modbus, fc: [2], every: 5 }
  - { from: occ-scada, to: tps-1, service: modbus, fc: [3, 4], every: 3 }
  - { from: occ-scada, to: tvc-1, service: modbus, fc: [3, 4], every: 5 }
  - { from: occ-scada, to: ets-1, service: modbus, fc: [2], every: 10 }
  - { from: bocc-scada, to: tps-1, service: modbus, fc: [4], every: 10 }
  - { from: historian, to: tps-1, service: modbus, fc: [4], every: 5 }
  - { from: historian, to: tvc-1, service: modbus, fc: [4], every: 5 }
  - { from: historian, to: ets-1, service: modbus, fc: [4], every: 10 }
  - { from: historian, to: hist-dmz, service: https, every: 10 }
  - { from: corp-pc, to: hist-dmz, service: https, every: 30 }

flows:
  - { id: hmi-plc, why: Station staff watch the traction power and register possessions from the control room., from: scr-1, to: tps-1, service: modbus, fc: [1, 2, 3, 4, 5, 6] }
  - { id: hmi-tvs, why: Station staff run the tunnel fans from the control room., from: scr-1, to: tvc-1, service: modbus, fc: [1, 2, 3, 4, 5, 6] }
  - { id: hmi-sis, why: Station staff see the emergency trip status., from: scr-1, to: ets-1, service: modbus, fc: [2, 4] }
  - { id: occ-plc, why: "The OCC energizes and de-energizes the line and resets trips.", from: occ-scada, to: tps-1, service: modbus, fc: [3, 4, 5, 6] }
  - { id: occ-tvs, why: The OCC commands fire mode from the control centre., from: occ-scada, to: tvc-1, service: modbus, fc: [3, 4, 5, 6] }
  - { id: occ-sis, why: The OCC sees the emergency trip status., from: occ-scada, to: ets-1, service: modbus, fc: [2, 4] }
  - { id: bocc-plc, why: "The backup OCC keeps a live copy of the traction power, ready to take over.", from: bocc-scada, to: tps-1, service: modbus, fc: [3, 4] }
  - { id: historian-plc, why: The historian records the traction power values., from: historian, to: tps-1, service: modbus, fc: [3, 4] }
  - { id: historian-tvs, why: The historian records the tunnel temperatures., from: historian, to: tvc-1, service: modbus, fc: [3, 4] }
  - { id: historian-sis, why: The historian records the emergency trip values., from: historian, to: ets-1, service: modbus, fc: [2, 4] }
  - { id: ews-plc, why: Engineers maintain the traction power controller., from: ews-1, to: tps-1, service: modbus, fc: [1, 2, 3, 4, 5, 6, 15, 16, 43] }
  - { id: ews-tvs, why: Engineers maintain the tunnel ventilation controller., from: ews-1, to: tvc-1, service: modbus, fc: [1, 2, 3, 4, 5, 6, 15, 16, 43] }
  - { id: historian-replica, why: The historian copies data to the DMZ so outsiders never touch the station., from: historian, to: hist-dmz, service: https }
  - { id: office-reports, why: Office staff read maintenance reports from the DMZ copy., from: corp-pc, to: hist-dmz, service: https }
  - id: vendor-support
    why: The traction power maker logs in for support, directly or through the jump host.
    paths:
      - [{ from: rail-vendor, to: jump-01, service: rdp }, { from: jump-01, to: ews-1, service: rdp }]
      - [{ from: rail-vendor, to: ews-1, service: rdp }]

ids:
  writers:
    tps-1: [scr-1, ews-1, occ-scada, bocc-scada]
    tvc-1: [scr-1, ews-1, occ-scada, bocc-scada]
  safety: [ets-1]
  identify: [ews-1]
