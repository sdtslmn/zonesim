# yaml-language-server: $schema=../schema/site.schema.json
#
# Meridian Line metro: a built-in ZoneSim site. One section of a metro line,
# run from the operations control centre (OCC). The traction power (PCS) and
# tunnel ventilation (TVCS) SCADA, the historian, the engineering workstation
# and the DMZ all sit at the OCC; the station has only the controllers, which
# the OCC reaches over the metro backbone. The backup OCC (BOCC) is passive:
# it sends nothing to the station until the OCC is lost and it takes over.

schema: zonesim-site/1
id: metro-line
name: Meridian Line metro
description: >-
  A metro line section run from the OCC. The OCC SCADA occ-scada controls
  traction power controller tps-1 (feeder breaker CB-11, 750 V third rail)
  and tunnel ventilation controller tvc-1 at the station, and watches the
  emergency trip system ets-1 that keeps the power off while a crew is on
  the track. The backup OCC stays passive until the OCC is lost. The
  traction power maker supports the system from the internet, and as found
  the OCC network and the backbone to the station are one flat network.

process:
  model: metro-line
  tags:
    line: Meridian Line
    substation: TPSS-1
    rectifier: RECT-1
    feeder: CB-11
    fan1: TVF-1
    fan2: TVF-2
    tunnel: Central to Quay tunnel
  params:
    trains: 6              # trains in service on the section
    lineVoltage: 750       # V DC, third rail
    trainCurrent: 400      # A per moving train, on average
    overcurrent: 5000      # A, default feeder trip setting
    etsTrip: 9000          # A, emergency trip system backup trip
    faultCurrent: 12000    # A, a short circuit on the line
    tunnelShare: 67        # % of the trains in the tunnel at any time
    ambient: 26            # °C, tunnel with no trains
    fanStart: 30           # °C, the first tunnel fan starts
    hotAlarm: 35           # °C
    heatStress: 40         # °C, passengers in a stranded train at risk
    possessionTime: 1800   # s a work crew stays on the track

hosts:
  - { name: rail-vendor, role: vendor, ip: 198.51.100.40, level: 5, kind: external, services: [], os: Windows 11, user: vendor, description: Traction power maker's remote support }
  - { name: corp-pc, role: office, ip: 172.20.40.21, level: 4, kind: it, services: [rdp], os: Windows 11, user: nadia, description: Office PC in the OCC building }
  - { name: hist-dmz, role: report-server, ip: 172.20.35.10, level: 3.5, kind: dmz, services: [https], os: Linux, user: svc-report, description: "Historian copy for maintenance reports, at the OCC" }
  - { name: jump-01, role: jump, ip: 172.20.35.20, level: 3.5, kind: dmz, services: [rdp, ssh], os: Windows Server 2022, user: vendor, description: "Remote access jump host, at the OCC" }
  - { name: historian, role: historian, ip: 172.20.30.10, level: 3, kind: ot, services: [https, ssh], os: Windows Server 2019, user: svc-hist, description: PCS and TVCS historian at the OCC }
  - { name: occ-scada, role: hmi, ip: 172.20.20.10, level: 2, kind: ot, services: [https, rdp], os: Linux, user: controller, description: "PCS and TVCS SCADA at the OCC: servers and operator workstations" }
  - { name: ews-1, role: ews, ip: 172.20.20.30, level: 2, kind: ot, services: [rdp], os: Windows 10, user: engineer, description: Engineering workstation at the OCC }
  - { name: bocc-scada, role: backup-centre, ip: 10.40.20.10, level: 2, kind: ot, services: [https], os: Linux, user: controller, description: "Backup OCC SCADA: passive until the OCC is lost" }
  - { name: tps-1, role: plc, ip: 172.21.10.10, level: 1, kind: ot, services: [modbus, http], os: "VT-PCS 500, firmware 3.2.0", description: Traction power substation controller at Central }
  - { name: tvc-1, role: tvs, ip: 172.21.10.20, level: 1, kind: ot, services: [modbus], os: "AC-TVS 20, firmware 2.6.1", description: Tunnel ventilation controller at Central }
  - { name: ets-1, role: sis, ip: 172.21.10.30, level: 1, kind: ot, services: [modbus], os: "VT-ETS 10, firmware 1.4.2", description: Emergency trip system at the Central substation }

# As found: the OCC network and the backbone to the station are one flat
# network, the BOCC link is open to all of it, and the traction power maker
# has a port forward to the engineering workstation.
zones:
  - { name: internet, description: Everything outside the metro, hosts: [rail-vendor] }
  - { name: bocc, port: wan2, description: The backup OCC across the metro WAN, hosts: [bocc-scada] }
  - name: metro
    description: "The OCC network and the backbone to the station as found: office, DMZ, SCADA and controllers on one flat network"
    hosts: [corp-pc, hist-dmz, jump-01, historian, occ-scada, ews-1, tps-1, tvc-1, ets-1]

conduits:
  - name: edge
    zones: [internet, metro]
    rules:
      - allow from rail-vendor to ews-1 rdp
  - name: bocc-link
    zones: [bocc, metro]
    rules:
      - allow from bocc to metro any
      - allow from occ-scada to bocc-scada https

# The backbone firewall at the OCC, a Cisco switch in the OCC equipment room
# and a Hirschmann switch in the Central substation. The BOCC comes in on
# firewall port wan2.
network:
  firewall: { name: fw-01, vendor: fortinet, model: FortiGate Rugged 60F, firmware: v7.4.4, hostname: FGR60F-MERIDIAN, ip: 192.168.250.1 }
  switches:
    - name: sw-occ
      vendor: cisco
      model: IE-3400
      firmware: 17.9.4
      hostname: SW-MERIDIAN-OCC
      ip: 192.168.250.11
      ports: { Gi1/1: corp-pc, Gi1/2: hist-dmz, Gi1/3: jump-01, Gi1/4: historian, Gi1/5: occ-scada, Gi1/6: ews-1, Gi1/7: null, Gi1/8: null }
    - name: sw-station
      vendor: hirschmann
      model: RSP35
      firmware: 09.4.03
      hostname: SW-CENTRAL-TPSS
      ip: 192.168.250.12
      ports: { "1/1": tps-1, "1/2": tvc-1, "1/3": ets-1, "1/4": null, "1/5": null }

devices:
  tps-1:
    title: traction power controller
    vendor: Voltline Traction
    product: VT-PCS 500
    revision: 3.2.0
    points:
      coil:
        - { addr: 0, tag: CB11_CLOSE, signal: feeder.command, description: "Feeder breaker CB-11 close command (1 = energize the line)" }
        - { addr: 1, tag: RECT1_ENABLE, signal: rectifier.enable, description: Rectifier RECT-1 on }
        - { addr: 2, tag: CB11_AUTO_RECLOSE, signal: control.auto, description: "1 = reclose CB-11 once after a protection trip" }
        - { addr: 3, tag: PSN_REGISTERED, signal: possession, description: "Work possession registered: crew on the track, CB-11 held open" }
      di:
        - { addr: 0, tag: CB11_CLOSED, signal: feeder.closed, description: Feeder breaker CB-11 closed }
        - { addr: 1, tag: RECT1_RUNNING, signal: rectifier.running, description: Rectifier RECT-1 running }
        - { addr: 2, tag: CB11_OC_TRIP, signal: alarm.trip, description: CB-11 tripped on overcurrent }
      ir:
        - { addr: 0, tag: VT_LINE, signal: voltage.line, description: Line voltage, units: V }
        - { addr: 1, tag: IT_CB11, signal: current.feeder, description: Feeder current, units: A }
        - { addr: 2, tag: TRAINS_MOVING, signal: trains.moving, description: Trains moving on the section }
        - { addr: 3, tag: TRAINS_STOPPED, signal: trains.stranded, description: Trains stopped in the tunnel }
      hr:
        - { addr: 0, tag: CB11_OC_SP, signal: setpoint.overcurrent, description: CB-11 overcurrent trip setting, units: A }
  tvc-1:
    title: tunnel ventilation controller
    vendor: Aircourse Systems
    product: AC-TVS 20
    revision: 2.6.1
    points:
      coil:
        - { addr: 0, tag: TVF1_RUN, signal: fan1.run, description: Tunnel fan TVF-1 run command (manual mode only) }
        - { addr: 1, tag: TVF2_RUN, signal: fan2.run, description: Tunnel fan TVF-2 run command (manual mode only) }
        - { addr: 2, tag: TVS_AUTO, signal: vent.auto, description: "1 = fans start on tunnel temperature, 0 = manual" }
        - { addr: 3, tag: FIRE_MODE, signal: fire.mode, description: "Fire mode: both fans at full, trains held at stations" }
      di:
        - { addr: 0, tag: TVF1_RUNNING, signal: fan1.running, description: Tunnel fan TVF-1 running }
        - { addr: 1, tag: TVF2_RUNNING, signal: fan2.running, description: Tunnel fan TVF-2 running }
        - { addr: 2, tag: TAH_TUNNEL, signal: alarm.tunnel_hot, description: Tunnel temperature high }
        - { addr: 3, tag: FIRE_MODE_ON, signal: fire.mode_active, description: Fire mode active }
      ir:
        - { addr: 0, tag: TT_TUNNEL, signal: temp.tunnel, description: Tunnel temperature, units: tenths of a °C }
      hr:
        - { addr: 0, tag: TVF_START_SP, signal: setpoint.fan_start, description: Tunnel temperature at which TVF-1 starts, units: tenths of a °C }
  ets-1:
    title: emergency trip system
    vendor: Voltline Traction
    product: VT-ETS 10
    revision: 1.4.2
    points:
      coil:
        - { addr: 0, tag: ETS_BYPASS, signal: sis.bypass, description: Emergency trip bypass (commissioning only) }
      di:
        - { addr: 0, tag: ETS_TRIPPED, signal: sis.tripped, description: "Emergency trip active: rectifier held off" }
        - { addr: 1, tag: ETS_BYPASSED, signal: sis.bypassed, description: Emergency trip bypassed }
        - { addr: 2, tag: PSN_KEY, signal: crew.on_track, description: "Possession key switch: a crew is on the track" }
      ir:
        - { addr: 0, tag: IT_ETS, signal: sis.current, description: Independent feeder current measurement, units: A }
      hr:
        - { addr: 0, tag: ETS_OC_SP, signal: sis.trip_current, description: Backup overcurrent trip, units: A }

hmi:
  host: occ-scada
  device: tps-1
  timeout: 6

# The OCC runs the line. The BOCC sends nothing to the station until the OCC
# is lost (takeover start in the terminal); then it takes over the OCC's role.
standby:
  centre: OCC
  backupName: BOCC
  backup: bocc-scada
  lost: [occ-scada, ews-1, historian, hist-dmz, jump-01, corp-pc]

polling:
  - { from: occ-scada, to: tps-1, service: modbus, fc: [3, 4], every: 2 }
  - { from: occ-scada, to: tvc-1, service: modbus, fc: [3, 4], every: 2 }
  - { from: occ-scada, to: ets-1, service: modbus, fc: [2], every: 5 }
  - { from: occ-scada, to: bocc-scada, service: https, every: 10 }
  - { from: historian, to: occ-scada, service: https, every: 5 }
  - { from: historian, to: hist-dmz, service: https, every: 10 }
  - { from: corp-pc, to: hist-dmz, service: https, every: 30 }
  - { from: bocc-scada, to: tps-1, service: modbus, fc: [3, 4], every: 2, when: takeover }
  - { from: bocc-scada, to: tvc-1, service: modbus, fc: [3, 4], every: 2, when: takeover }
  - { from: bocc-scada, to: ets-1, service: modbus, fc: [2], every: 5, when: takeover }

flows:
  - { id: hmi-plc, why: The OCC power controller runs the traction power and registers possessions., from: occ-scada, to: tps-1, service: modbus, fc: [1, 2, 3, 4, 5, 6] }
  - { id: hmi-tvs, why: The OCC runs the tunnel fans and fire mode., from: occ-scada, to: tvc-1, service: modbus, fc: [1, 2, 3, 4, 5, 6] }
  - { id: hmi-sis, why: The OCC sees the emergency trip status., from: occ-scada, to: ets-1, service: modbus, fc: [2, 4] }
  - { id: bocc-sync, why: "The OCC keeps the BOCC's database in step, so the BOCC can take over at any moment.", from: occ-scada, to: bocc-scada, service: https }
  - { id: historian-scada, why: The historian collects values from the SCADA servers., from: historian, to: occ-scada, service: https }
  - { id: ews-plc, why: Engineers maintain the traction power controller from the OCC., from: ews-1, to: tps-1, service: modbus, fc: [1, 2, 3, 4, 5, 6, 15, 16, 43] }
  - { id: ews-tvs, why: Engineers maintain the tunnel ventilation controller from the OCC., from: ews-1, to: tvc-1, service: modbus, fc: [1, 2, 3, 4, 5, 6, 15, 16, 43] }
  - { id: historian-replica, why: The historian copies data to the DMZ so outsiders never touch the control network., from: historian, to: hist-dmz, service: https }
  - { id: office-reports, why: Office staff read maintenance reports from the DMZ copy., from: corp-pc, to: hist-dmz, service: https }
  - id: vendor-support
    why: The traction power maker logs in for support, directly or through the jump host.
    paths:
      - [{ from: rail-vendor, to: jump-01, service: rdp }, { from: jump-01, to: ews-1, service: rdp }]
      - [{ from: rail-vendor, to: ews-1, service: rdp }]
  - { id: bocc-plc, when: takeover, why: "Once the OCC is lost, the BOCC runs the traction power.", from: bocc-scada, to: tps-1, service: modbus, fc: [1, 2, 3, 4, 5, 6] }
  - { id: bocc-tvs, when: takeover, why: "Once the OCC is lost, the BOCC runs the tunnel fans and fire mode.", from: bocc-scada, to: tvc-1, service: modbus, fc: [1, 2, 3, 4, 5, 6] }
  - { id: bocc-sis, when: takeover, why: "Once the OCC is lost, the BOCC sees the emergency trip status.", from: bocc-scada, to: ets-1, service: modbus, fc: [2, 4] }

ids:
  writers:
    tps-1: [occ-scada, ews-1, bocc-scada]
    tvc-1: [occ-scada, ews-1, bocc-scada]
  safety: [ets-1]
  identify: [ews-1]
