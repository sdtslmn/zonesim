id: b03-operator-write
site: riverside-water
title: Change a setpoint like an operator
level: beginner
minutes: 8
topic: Modbus basics
intro: |
  Operators change setpoints from the HMI. Under the hood the HMI writes a
  holding register with function code 6.

  The plant manager wants the tank to stop filling at ${param.stopLevel-5} % instead of
  ${param.stopLevel} %, to leave room for storm water. Make the change the way the HMI would.
tasks:
  - From ${hmi}, set the pump stop level (${plc} holding register ${plc:setpoint.stop}) to ${param.stopLevel-5} %. The raw value is ${param.stopLevel*10-50}.
  - Read the register back to confirm the PLC took it.
  - Run `wait 60` and then `plant` to watch the tank stop filling at the new level.
checks:
  - name: The pump stop level is ${param.stopLevel-5} % (hr ${plc:setpoint.stop} = ${param.stopLevel*10-50})
    register: { host: "${plc}", signal: setpoint.stop, equals: "${param.stopLevel*10-50}" }
  - name: The IDS raised no alert, because ${hmi} is an expected writer
    alert: { title: Unauthorized, exists: false }
hints:
  - "`modbus write ${plc} hr ${plc:setpoint.stop} ${param.stopLevel*10-50}` sends function code 6 to holding register ${plc:setpoint.stop}."
  - "Run it on the HMI host: `ssh ${hmi} modbus write ${plc} hr ${plc:setpoint.stop} ${param.stopLevel*10-50}`."
solution:
  - ssh ${hmi} modbus write ${plc} hr ${plc:setpoint.stop} ${param.stopLevel*10-50}
  - ssh ${hmi} modbus read ${plc} hr ${plc:setpoint.stop}
learned: |
  Function code 6 writes one holding register, and the PLC simply trusts
  whoever sends it. The IDS stayed quiet because ${hmi} is in its baseline of
  hosts that normally write to ${plc}. The same command from any other host
  would be an attack, and the next lab shows how easy that is.
refs:
  - Modbus Application Protocol Specification v1.1b3
