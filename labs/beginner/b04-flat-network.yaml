id: b04-flat-network
site: riverside-water
title: Why a flat network is dangerous
level: beginner
minutes: 12
topic: Attack and detection
intro: |
  The office PC ${office} sits on the same flat network as the PLC, and office
  PCs are where phishing emails land. Play the attacker on ${office} to see
  what that means, then put the plant right and handle the alert.

  This is a simulated plant, so go ahead.
tasks:
  - "From ${office}, find the controllers: `ssh ${office} nmap ${plc.net}`."
  - From ${office}, turn off chlorine dosing by writing 0 to ${plc} coil ${plc:dosing.enable}.
  - Run `wait 60` and then `plant`. The chlorine residual drops and an alarm appears.
  - Back on the console, run `alerts`. Open the alert about the write with `alerts show ID`.
  - From ${hmi}, turn dosing back on (coil ${plc:dosing.enable} = 1).
  - Acknowledge the alerts once you have read them.
checks:
  - name: The IDS noticed the scan from ${office}
    alert: { title: Network scan, src: "${office}" }
  - name: Chlorine dosing is back on (${plc} coil ${plc:dosing.enable} = 1)
    register: { host: "${plc}", signal: dosing.enable, equals: 1 }
  - name: The alert for ${office}'s write is acknowledged
    alert: { title: Unauthorized Modbus write, src: "${office}", acked: true }
hints:
  - "`ssh ${office} modbus write ${plc} coil ${plc:dosing.enable} 0` turns dosing off."
  - "`ssh ${hmi} modbus write ${plc} coil ${plc:dosing.enable} 1` turns it back on."
  - "`alerts` lists the IDs. `alerts ack A-1001` acknowledges one, `alerts ack all` all of them."
solution:
  - ssh ${office} nmap ${plc.net}
  - ssh ${office} modbus write ${plc} coil ${plc:dosing.enable} 0
  - wait 60
  - ssh ${hmi} modbus write ${plc} coil ${plc:dosing.enable} 1
  - alerts ack all
learned: |
  On a flat network one compromised office PC can change how drinking water
  is treated. Modbus has no authentication, so the PLC cannot tell an
  operator from an attacker. The IDS detected the scan and the write, but
  detection does not stop anything. Prevention starts with segmentation into
  zones and conduits, which is what the next labs are about.
refs:
  - IEC 62443-3-3 SR 5.1 (network segmentation)
  - MITRE ATT&CK for ICS T0855 (unauthorized command message)
