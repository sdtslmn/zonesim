id: b04-flat-network
title: Why a flat network is dangerous
level: beginner
minutes: 12
topic: Attack and detection
intro: |
  The office PC corp-pc sits on the same flat network as the PLC, and office
  PCs are where phishing emails land. Play the attacker on corp-pc to see
  what that means, then put the plant right and handle the alert.

  This is a simulated plant, so go ahead.
tasks:
  - "From corp-pc, find the controllers: `ssh corp-pc nmap 10.10.10.0/24`."
  - From corp-pc, turn off chlorine dosing by writing 0 to plc-1 coil 1.
  - Run `wait 60` and then `plant`. The chlorine residual drops and an alarm appears.
  - Back on the console, run `alerts`. Open the alert about the write with `alerts show ID`.
  - From hmi-01, turn dosing back on (coil 1 = 1).
  - Acknowledge the alerts once you have read them.
checks:
  - name: The IDS noticed the scan from corp-pc
    alert: { title: Network scan, src: corp-pc }
  - name: Chlorine dosing is back on (plc-1 coil 1 = 1)
    register: { host: plc-1, table: coil, addr: 1, equals: 1 }
  - name: The alert for corp-pc's write is acknowledged
    alert: { title: Unauthorized Modbus write, src: corp-pc, acked: true }
hints:
  - "`ssh corp-pc modbus write plc-1 coil 1 0` turns dosing off."
  - "`ssh hmi-01 modbus write plc-1 coil 1 1` turns it back on."
  - "`alerts` lists the IDs. `alerts ack A-1001` acknowledges one, `alerts ack all` all of them."
solution:
  - ssh corp-pc nmap 10.10.10.0/24
  - ssh corp-pc modbus write plc-1 coil 1 0
  - wait 60
  - ssh hmi-01 modbus write plc-1 coil 1 1
  - alerts ack all
learned: |
  On a flat network one compromised office PC can change how drinking water
  is treated. Modbus has no authentication, so the PLC cannot tell an
  operator from an attacker. The IDS detected the scan and the write, but
  detection does not stop anything. Prevention starts with segmentation into
  zones and conduits, which is what the next labs are about.
refs:
  - IEC 62443-3-3 SR 5.1 (network segmentation)
  - MITRE ATT&CK for ICS T0855 (unauthorized command message)
