id: s02-full-design
site: riverside-water
title: Segment the whole plant from scratch
level: scenario
minutes: 25
topic: Zones and conduits
intro: |
  Final challenge. Starting from the flat network as found, design the zones
  and conduits for the whole plant. The plant must keep running, and the
  design review must pass every check.

  No step-by-step help this time. `report` tells you where you stand, and
  `test` lets you check a single flow before you rely on it.
tasks:
  - Run `report`. You start with every data flow working and most security checks failing.
  - Design zones for the office, the DMZ, operations, control and safety, and move the hosts.
  - Add conduits with least-privilege rules, and filter Modbus function codes where it matters.
  - Route the vendor's remote access through ${jump}, with MFA.
  - Finish when `report` shows every data flow and every security check passing, and the safety zone has SL-T 3 or more.
checks:
  - name: Every plant data flow works
    required: all
  - name: Every security check in the report passes
    risk: all
  - name: The safety zone has SL-T 3 or more
    zone: { host: "${sis}", slAtLeast: 3 }
hints:
  - "Start with the zones from lab I01, then add conduits as in I02, filtering as in I03, the DMZ as in I04 and remote access as in I05."
  - "Delete the flat zone ${plc.zone} at the end. That also removes the old edge conduit with the direct vendor path."
  - "`report` shows the first problem for each failing check, and `test SRC DST SERVICE [fc N]` checks one flow."
solution:
  - zone create enterprise --sl 1
  - zone create dmz --sl 2
  - zone create operations --sl 2
  - zone create control --sl 3
  - zone create safety --sl 3
  - zone add enterprise ${office}
  - zone add dmz ${report-server} ${jump}
  - zone add operations ${historian}
  - zone add control ${hmi} ${ews} ${plc}
  - zone add safety ${sis}
  - zone delete ${plc.zone}
  - conduit create ops-control operations control
  - fw allow ops-control from ${historian} to ${plc} modbus fc 3,4
  - conduit create ops-safety operations safety
  - fw allow ops-safety from ${historian} to ${sis} modbus fc 2,4
  - conduit create control-safety control safety
  - fw allow control-safety from ${hmi} to ${sis} modbus fc read
  - conduit create ops-dmz operations dmz
  - fw allow ops-dmz from ${historian} to ${report-server} https
  - conduit create ent-dmz enterprise dmz
  - fw allow ent-dmz from ${office} to ${report-server} https
  - conduit create inet-dmz ${vendor.zone} dmz
  - fw allow inet-dmz from ${vendor} to ${jump} rdp
  - conduit create dmz-control dmz control
  - fw allow dmz-control from ${jump} to ${ews} rdp
  - host config ${jump} mfa=on
learned: |
  That is a complete zone and conduit design for a small plant: an office
  zone that only reaches the DMZ, a DMZ that brokers reports and remote
  access, an operations zone that reads but cannot write, a control zone,
  and a safety zone nobody can write to. In a real project this design comes
  out of a risk assessment, is documented per zone and conduit, and is
  reviewed every time the plant changes.
refs:
  - IEC 62443-3-2 (security risk assessment for system design)
  - IEC 62443-3-3 SR 5.1, SR 5.2
