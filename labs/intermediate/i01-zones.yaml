id: i01-zones
title: Group the hosts into zones
level: intermediate
minutes: 12
topic: Zones
intro: |
  IEC 62443-3-2 asks you to group assets with similar security needs into
  zones, then control the traffic between zones through conduits. A common
  starting point follows the Purdue levels: office (enterprise), DMZ,
  operations, control, and a zone of its own for the safety system.

  Each zone gets a target security level (SL-T, 1 to 4) from your risk
  assessment. The higher it is, the stronger the attacker it must resist.
tasks:
  - "Create the zones: enterprise (SL-T 1), dmz (SL-T 2), operations (SL-T 2), control (SL-T 3) and safety (SL-T 3). For example `zone create control --sl 3`."
  - "Move the hosts: corp-pc to enterprise; hist-dmz and jump-01 to dmz; historian to operations; hmi-01, ews-01 and plc-1 to control; sis-1 to safety."
  - Delete the old flat zone, site, once it is empty.
  - Run `plant`. Most data flows are now blocked, because nothing connects the zones yet. That is expected, the next lab adds conduits.
checks:
  - name: corp-pc is in an office zone without plant hosts
    zone: { host: corp-pc, notWith: [hist-dmz, historian, hmi-01, plc-1, sis-1] }
  - name: hist-dmz and jump-01 share a DMZ zone
    zone: { host: hist-dmz, with: [jump-01], notWith: [corp-pc, historian, plc-1] }
  - name: The historian has an operations zone of its own
    zone: { host: historian, notWith: [corp-pc, hist-dmz, hmi-01, plc-1, sis-1] }
  - name: hmi-01, ews-01 and plc-1 share the control zone, with SL-T 3 or more
    zone: { host: plc-1, with: [hmi-01, ews-01], notWith: [historian, sis-1], slAtLeast: 3 }
  - name: sis-1 is alone in the safety zone, with SL-T 3 or more
    zone: { host: sis-1, alone: true, slAtLeast: 3 }
  - name: The flat zone site is gone
    command: zone list
    outputNotMatches: '^site\b'
  - name: Office, DMZ and plant hosts are in separate zones
    risk: segmented
hints:
  - "`zone create enterprise --sl 1`, then `zone add enterprise corp-pc`."
  - "`zone add` takes several hosts at once: `zone add control hmi-01 ews-01 plc-1`."
  - "A zone must be empty before `zone delete site` works. `zone list` shows what is left in it."
solution:
  - zone create enterprise --sl 1
  - zone create dmz --sl 2
  - zone create operations --sl 2
  - zone create control --sl 3
  - zone create safety --sl 3
  - zone add enterprise corp-pc
  - zone add dmz hist-dmz jump-01
  - zone add operations historian
  - zone add control hmi-01 ews-01 plc-1
  - zone add safety sis-1
  - zone delete site
learned: |
  Zones group assets that share a level of risk and trust. The safety system
  gets a zone of its own because a compromise there could hurt people, and
  safety standards such as IEC 61511 expect it to stay independent from the
  control system. Without conduits nothing crosses a zone boundary, which is
  the safe default: you now add back only the traffic the plant needs.
refs:
  - IEC 62443-3-2 ZCR 3 (partition into zones and conduits)
  - IEC 62443-3-3 SR 5.1 (network segmentation)
