id: i03-modbus-dpi
title: Filter Modbus function codes
level: intermediate
minutes: 12
topic: Deep packet inspection
intro: |
  Your conduits allow Modbus, and plain Modbus is all or nothing: a host that
  may read may also write. The historian only needs to read, and nobody
  should write to the safety system over the network.

  Industrial firewalls with deep packet inspection can let through only
  certain function codes. Reads are 1, 2, 3, 4 and 43. Writes are 5, 6, 15
  and 16.
setup:
  - zone create enterprise --sl 1
  - zone create dmz --sl 2
  - zone create operations --sl 2
  - zone create control --sl 3
  - zone create safety --sl 3
  - zone add enterprise corp-pc
  - zone add dmz hist-dmz jump-01
  - zone add operations historian
  - zone add control hmi-01 ews-01 plc-1
  - zone add safety sis-1
  - zone delete site
  - conduit create ops-control operations control
  - fw allow ops-control from historian to plc-1 modbus
  - conduit create ops-safety operations safety
  - fw allow ops-safety from historian to sis-1 modbus
  - conduit create control-safety control safety
  - fw allow control-safety from hmi-01 to sis-1 modbus
  - conduit create ops-dmz operations dmz
  - fw allow ops-dmz from historian to hist-dmz https
  - conduit create ent-dmz enterprise dmz
  - fw allow ent-dmz from corp-pc to hist-dmz https
tasks:
  - "See the problem: `test historian plc-1 modbus fc 6`."
  - Limit the historian to plc-1 to function codes 3 and 4. Delete the broad rule and add a narrow one, or add the narrow one at the top with `at 1`.
  - Limit the historian to sis-1 to function codes 2 and 4, and hmi-01 to sis-1 to reads only.
  - "Prove it: from the historian, try `modbus write plc-1 hr 1 900`. It should time out. Then find the blocked request in `fw log`."
checks:
  - name: The historian cannot write to plc-1
    flow: { from: historian, to: plc-1, service: modbus, fc: 6, expect: blocked }
  - name: The historian still reads plc-1
    required: historian-plc
  - name: The historian still reads sis-1
    required: historian-sis
  - name: The HMI still reads sis-1
    required: hmi-sis
  - name: No host can write to the safety system
    risk: sis-read-only
  - name: You tried a write from the historian and the firewall blocked it
    command: fw log
    outputMatches: 'historian\s+plc-1\s+modbus fc (5|6|15|16)'
hints:
  - "`fw delete ops-control 1`, then `fw allow ops-control from historian to plc-1 modbus fc 3,4`."
  - "`fc read` is shorthand for 1,2,3,4,43. `fw list` shows every rule with its number."
  - "`ssh historian modbus write plc-1 hr 1 900` should now time out, and `fw log` shows why."
solution:
  - fw delete ops-control 1
  - fw allow ops-control from historian to plc-1 modbus fc 3,4
  - fw delete ops-safety 1
  - fw allow ops-safety from historian to sis-1 modbus fc 2,4
  - fw delete control-safety 1
  - fw allow control-safety from hmi-01 to sis-1 modbus fc read
  - "ssh historian modbus write plc-1 hr 1 900   # times out, as it should"
learned: |
  Deep packet inspection turns "may talk Modbus" into "may read these
  registers". The historian still gets its data, but a compromised historian
  can no longer change the process, and the safety system now only answers
  reads. When a write is dropped, the sender just sees a timeout: the
  firewall log is where you find out why.
refs:
  - IEC 62443-3-3 SR 5.2 (zone boundary protection)
