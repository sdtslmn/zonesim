id: m06-conduits
site: metro-line
title: Connect the zones with conduits
level: intermediate
minutes: 15
topic: Conduits
intro: |
  The zones are in place and the OCC is blind: the SCADA has lost the
  station, the historian has no data, the BOCC is out of step, and the
  reports are empty. Add conduits with firewall rules for exactly the flows
  the line needs today. A new conduit denies everything.

  The BOCC needs only one thing while the OCC has control: the OCC keeping
  its database in step. It sends nothing to the station, so it gets no path
  there in this lab. `plant` and `report` list each blocked flow and the
  reason.
setup:
  - zone create enterprise --sl 1
  - zone create dmz --sl 2
  - zone create operations --sl 2
  - zone create control --sl 3
  - zone create station --sl 3
  - zone create safety --sl 3
  - zone set ${backup-centre.zone} --sl 3
  - zone add enterprise ${office}
  - zone add dmz ${report-server} ${jump}
  - zone add operations ${historian}
  - zone add control ${hmi} ${ews}
  - zone add station ${plc} ${tvs}
  - zone add safety ${sis}
  - zone delete ${plc.zone}
tasks:
  - Run `plant` to see which data flows are blocked.
  - "Create a conduit for each pair of zones that must talk, for example `conduit create control-station control station`."
  - "Add an allow rule for each flow, for example `fw allow control-station from ${hmi} to ${plc} modbus`."
  - Bring back every data flow except the traction power maker's remote login (that is lab M08). The OCC SCADA needs ${plc}, ${tvs} and ${sis}; ${ews} needs ${plc} and ${tvs}; the historian reads the OCC SCADA; the OCC SCADA keeps the BOCC in step.
  - Keep the office away from the control network, and keep the BOCC passive.
checks:
  - name: The OCC SCADA runs the traction power
    required: hmi-plc
  - name: The OCC SCADA runs the tunnel ventilation
    required: hmi-tvs
  - name: The OCC SCADA sees the emergency trip status
    required: hmi-sis
  - name: Engineers reach ${plc} and ${tvs} from the OCC
    required: ews-plc
  - name: Engineers reach ${tvs}
    required: ews-tvs
  - name: The historian collects from the OCC SCADA
    required: historian-scada
  - name: The OCC keeps the BOCC in step
    required: bocc-sync
  - name: The historian copies data to ${report-server}
    required: historian-replica
  - name: Office reports work from ${report-server}
    required: office-reports
  - name: ${office} cannot reach ${plc}
    flow: { from: "${office}", to: "${plc}", service: modbus, expect: blocked }
  - name: The BOCC stays passive while the OCC has control
    risk: standby-passive
hints:
  - "The OCC control zone talks to four zones: station (${plc}, ${tvs}), safety (${sis}), operations (the historian reads ${hmi}) and the BOCC's zone ${backup-centre.zone}."
  - "`conduit create control-bocc control ${backup-centre.zone}`, then `fw allow control-bocc from ${hmi} to ${backup-centre} https`. The rule is one-way: the BOCC cannot start anything towards the OCC."
  - "The historian reads the SCADA, not the controllers: `fw allow ops-control from ${historian} to ${hmi} https`."
solution:
  - conduit create control-station control station
  - fw allow control-station from ${hmi} to ${plc} modbus
  - fw allow control-station from ${hmi} to ${tvs} modbus
  - fw allow control-station from ${ews} to ${plc} modbus
  - fw allow control-station from ${ews} to ${tvs} modbus
  - conduit create control-safety control safety
  - fw allow control-safety from ${hmi} to ${sis} modbus
  - conduit create ops-control operations control
  - fw allow ops-control from ${historian} to ${hmi} https
  - conduit create control-bocc control ${backup-centre.zone}
  - fw allow control-bocc from ${hmi} to ${backup-centre} https
  - conduit create ops-dmz operations dmz
  - fw allow ops-dmz from ${historian} to ${report-server} https
  - conduit create ent-dmz enterprise dmz
  - fw allow ent-dmz from ${office} to ${report-server} https
learned: |
  The station only ever hears from the OCC: the SCADA and the engineering
  workstation. The historian, the office and the BOCC never talk to a
  controller. Look at the OCC's rules though: plain Modbus lets the SCADA
  reprogram a controller and write to the emergency trip system. And the
  BOCC has no way to take over yet. The next lab fixes both.
refs:
  - IEC 62443-3-2 ZCR 3 (partition into zones and conduits)
  - IEC 62443-3-3 SR 5.2 RE 1 (deny by default, allow by exception)
