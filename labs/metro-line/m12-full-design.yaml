id: m12-full-design
site: metro-line
title: Segment the whole line from scratch
level: scenario
minutes: 25
topic: Zones and conduits
intro: |
  Final challenge for this line. Starting from the flat network as found,
  design the zones and conduits for the OCC, the station and the BOCC,
  including the traction power maker's access. The trains must keep
  running, the BOCC must stay passive but ready to take over, and the design
  review must pass every check.

  No step-by-step help this time. `report` tells you where you stand, and
  `test` checks a single flow before you rely on it.
tasks:
  - Run `report`. Every data flow works and most security checks fail.
  - Design zones for the OCC (office, DMZ, operations, control), the station (controllers, safety) and give the BOCC's zone a target level.
  - Add conduits with least-privilege rules, and filter Modbus function codes where it matters.
  - Build the BOCC's takeover rules and switch them off.
  - Route the traction power maker's logins through ${jump}, with MFA.
  - Finish when `report` shows every data flow and every security check passing, and the safety zone has SL-T 3 or more.
checks:
  - name: Every data flow works
    required: all
  - name: Every security check in the report passes
    risk: all
  - name: The safety zone has SL-T 3 or more
    zone: { host: "${sis}", slAtLeast: 3 }
  - name: The trains are still moving
    state: { path: plant.trainsMoving, gte: 1 }
hints:
  - "Start with the zones from lab M05, then conduits as in M06 with the filters and the passive BOCC from M07, and remote access as in M08."
  - "Deleting the flat zone ${plc.zone} also removes the old edge and BOCC conduits, with their broad rules."
  - "`report` shows the first problem for each failing check, and `test SRC DST SERVICE [fc N]` checks one flow."
solution:
  - zone create enterprise --sl 1
  - zone create dmz --sl 2
  - zone create operations --sl 2
  - zone create control --sl 3
  - zone create station --sl 3
  - zone create safety --sl 3
  - zone set ${backup-centre.zone} --sl 3
  - zone add enterprise ${office}
  - zone add dmz ${report-server} ${jump}
  - zone add operations ${historian}
  - zone add control ${hmi} ${ews}
  - zone add station ${plc} ${tvs}
  - zone add safety ${sis}
  - zone delete ${plc.zone}
  - conduit create control-station control station
  - fw allow control-station from ${hmi} to ${plc} modbus fc 1,2,3,4,5,6
  - fw allow control-station from ${hmi} to ${tvs} modbus fc 1,2,3,4,5,6
  - fw allow control-station from ${ews} to ${plc} modbus
  - fw allow control-station from ${ews} to ${tvs} modbus
  - conduit create control-safety control safety
  - fw allow control-safety from ${hmi} to ${sis} modbus fc 2,4
  - conduit create ops-control operations control
  - fw allow ops-control from ${historian} to ${hmi} https
  - conduit create control-bocc control ${backup-centre.zone}
  - fw allow control-bocc from ${hmi} to ${backup-centre} https
  - conduit create bocc-station ${backup-centre.zone} station
  - fw allow bocc-station from ${backup-centre} to ${plc} modbus fc 1,2,3,4,5,6
  - fw allow bocc-station from ${backup-centre} to ${tvs} modbus fc 1,2,3,4,5,6
  - fw disable bocc-station 1
  - fw disable bocc-station 2
  - conduit create bocc-safety ${backup-centre.zone} safety
  - fw allow bocc-safety from ${backup-centre} to ${sis} modbus fc 2,4
  - fw disable bocc-safety 1
  - conduit create ops-dmz operations dmz
  - fw allow ops-dmz from ${historian} to ${report-server} https
  - conduit create ent-dmz enterprise dmz
  - fw allow ent-dmz from ${office} to ${report-server} https
  - conduit create inet-dmz ${vendor.zone} dmz
  - fw allow inet-dmz from ${vendor} to ${jump} rdp
  - conduit create dmz-control dmz control
  - fw allow dmz-control from ${jump} to ${ews} rdp
  - host config ${jump} mfa=on
learned: |
  That is a complete design for a metro line: the office only reaches the
  DMZ, the historian reads the SCADA and never a controller, the station
  only hears from the OCC SCADA and the engineering workstation, nobody can
  write to the emergency trip system, and the BOCC holds tested rules that
  stay off until the OCC is lost. In a real project this comes out of a risk
  assessment with the operator, the OCC and each system supplier.
refs:
  - IEC 62443-3-2 (security risk assessment for system design)
  - CLC/TS 50701 (railway applications, cybersecurity)
