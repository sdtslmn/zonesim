id: m05-zones
site: metro-line
title: Group the OCC and the station into zones
level: intermediate
minutes: 12
topic: Zones
intro: |
  Group the hosts into zones by what they do and how much you trust them.
  At the OCC: the office, the DMZ, operations (the historian) and control
  (the SCADA and the engineering workstation). At the station: the
  controllers in one zone, and the emergency trip system in a zone of its
  own. The BOCC already sits in a zone of its own, ${backup-centre.zone},
  across the WAN.

  Each zone gets a target security level (SL-T, 1 to 4) from the risk
  assessment.
tasks:
  - "Create the zones: enterprise (SL-T 1), dmz (SL-T 2), operations (SL-T 2), control (SL-T 3), station (SL-T 3) and safety (SL-T 3), for example `zone create control --sl 3`."
  - "Give the BOCC's zone a target too: `zone set ${backup-centre.zone} --sl 3`. It can run the whole line."
  - "Move the hosts: ${office} to enterprise; ${report-server} and ${jump} to dmz; ${historian} to operations; ${hmi} and ${ews} to control; ${plc} and ${tvs} to station; ${sis} to safety."
  - Delete the flat zone, ${plc.zone}, once it is empty.
  - Run `plant`. Most data flows are blocked now, because nothing connects the zones yet. The next lab adds conduits.
checks:
  - name: ${office} is in an office zone without control hosts
    zone: { host: "${office}", notWith: ["${report-server}", "${historian}", "${hmi}", "${plc}", "${sis}"] }
  - name: ${report-server} and ${jump} share a DMZ zone
    zone: { host: "${report-server}", with: ["${jump}"], notWith: ["${office}", "${historian}", "${hmi}"] }
  - name: The historian has an operations zone of its own
    zone: { host: "${historian}", notWith: ["${office}", "${report-server}", "${hmi}", "${plc}", "${sis}"] }
  - name: The OCC SCADA and ${ews} share a control zone with SL-T 3 or more
    zone: { host: "${hmi}", with: ["${ews}"], notWith: ["${historian}", "${plc}", "${sis}"], slAtLeast: 3 }
  - name: ${plc} and ${tvs} share a station zone with SL-T 3 or more
    zone: { host: "${plc}", with: ["${tvs}"], notWith: ["${hmi}", "${sis}"], slAtLeast: 3 }
  - name: ${sis} is alone in the safety zone, with SL-T 3 or more
    zone: { host: "${sis}", alone: true, slAtLeast: 3 }
  - name: The BOCC is alone in its zone, with SL-T 3 or more
    zone: { host: "${backup-centre}", alone: true, slAtLeast: 3 }
  - name: The flat zone ${plc.zone} is gone
    command: zone list
    outputNotMatches: '^${plc.zone}\b'
  - name: Office, DMZ and plant hosts are in separate zones
    risk: segmented
hints:
  - "`zone create enterprise --sl 1`, then `zone add enterprise ${office}`."
  - "`zone add` takes several hosts at once: `zone add station ${plc} ${tvs}`."
  - "`zone delete ${plc.zone}` works once the zone is empty. Deleting it also removes the old conduits to it."
solution:
  - zone create enterprise --sl 1
  - zone create dmz --sl 2
  - zone create operations --sl 2
  - zone create control --sl 3
  - zone create station --sl 3
  - zone create safety --sl 3
  - zone set ${backup-centre.zone} --sl 3
  - zone add enterprise ${office}
  - zone add dmz ${report-server} ${jump}
  - zone add operations ${historian}
  - zone add control ${hmi} ${ews}
  - zone add station ${plc} ${tvs}
  - zone add safety ${sis}
  - zone delete ${plc.zone}
learned: |
  The SCADA at the OCC and the controllers at the station are separate
  zones even though one system runs the other: the backbone between them is
  long, shared and exposed, so every byte across it should pass a conduit.
  The BOCC gets the same security level as the OCC control zone, because on
  the day it takes over it can do everything the OCC can.
refs:
  - IEC 62443-3-2 ZCR 3 (partition into zones and conduits)
  - CLC/TS 50701 (railway applications, cybersecurity)
