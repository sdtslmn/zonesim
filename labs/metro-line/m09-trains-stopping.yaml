id: m09-trains-stopping
site: metro-line
title: Trains keep stopping
level: advanced
minutes: 15
topic: Incident response
intro: |
  Monday, 07:40, the morning peak. Feeder breaker ${tag.feeder} has tripped
  twice in two minutes and stays open. Trains are stranded in the
  ${tag.tunnel} and the OCC power controller wants the power back. Nothing
  is wrong with the track. The IDS raised alerts overnight. The network is
  still flat.

  Find out what changed, put it right, and stop it from happening again
  without cutting the OCC off from the station.
setup:
  - ssh ${office} nmap -p 502 ${plc.net}
  - ssh ${office} modbus info ${plc}
  - ssh ${office} modbus write ${plc} hr ${plc:setpoint.overcurrent} 1500
settle: 60
tasks:
  - Run `plant` and read the feeder's trip setting. The normal value is ${param.overcurrent} A, and normal traffic draws up to about ${param.trains*param.trainCurrent*5/4} A.
  - Read the alerts. Which host changed the setting? Write its name into attacker.txt.
  - From ${hmi}, restore the trip setting (raw ${param.overcurrent}), then close the feeder (coil ${plc:feeder.command} = 1).
  - "Contain it: that host must no longer reach ${plc} over Modbus, while every data flow keeps working."
  - Run `wait 60` and check that the trains are moving.
  - Acknowledge the alerts once they are handled.
checks:
  - name: attacker.txt names the source of the write
    file: { path: attacker.txt, matches: '${office}|${office.ip}' }
  - name: The trip setting is back to ${param.overcurrent} A
    register: { host: "${plc}", signal: setpoint.overcurrent, equals: "${param.overcurrent}" }
  - name: The trains are moving again
    state: { path: plant.trainsMoving, gte: 1 }
  - name: No train is stranded in the tunnel
    state: { path: plant.trainsStranded, equals: 0 }
  - name: The source host can no longer write to ${plc}
    flow: { from: "${office}", to: "${plc}", service: modbus, fc: 6, expect: blocked }
  - name: Every data flow still works
    required: all
  - name: The alert for the write is acknowledged
    alert: { title: Unauthorized Modbus write, src: "${office}", acked: true }
hints:
  - "`plant` shows the trip setting next to the feeder current. `alerts show ID` gives the source IP, and `hosts | grep ${office.ip}` turns it into a name."
  - "`ssh ${hmi} modbus write ${plc} hr ${plc:setpoint.overcurrent} ${param.overcurrent}`, then `ssh ${hmi} modbus write ${plc} coil ${plc:feeder.command} 1`."
  - "Put ${office} in a zone of its own, then connect it to ${plc.zone} with one rule: ${office} to ${report-server} https."
solution:
  - alerts
  - echo ${office} > attacker.txt
  - ssh ${hmi} modbus write ${plc} hr ${plc:setpoint.overcurrent} ${param.overcurrent}
  - ssh ${hmi} modbus write ${plc} coil ${plc:feeder.command} 1
  - zone create enterprise --sl 1
  - zone add enterprise ${office}
  - conduit create ent-metro enterprise ${plc.zone}
  - fw allow ent-metro from ${office} to ${report-server} https
  - wait 60
  - alerts ack all
learned: |
  Nothing was switched off. One protection setting was lowered below the
  current that normal traffic draws, and the breaker did exactly what it was
  told: it tripped, reclosed once, tripped again and locked out. To the OCC
  it looked like a fault on the line. The IDS alert on a write from an
  unexpected host is what tells an attack from a fault.
refs:
  - NIST SP 800-61 (incident handling)
  - MITRE ATT&CK for ICS T0836 (modify parameter)
