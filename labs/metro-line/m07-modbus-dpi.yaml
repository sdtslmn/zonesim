id: m07-modbus-dpi
site: metro-line
title: Filter Modbus across the WAN
level: intermediate
minutes: 14
topic: Deep packet inspection
intro: |
  Your conduits allow Modbus, and plain Modbus is all or nothing. The
  historian only needs to read. The OCC needs to read the station, switch
  the feeder and the fans (function code 5) and change settings (function
  code 6), but nothing more. The backup OCC only keeps a live copy until the
  OCC hands control over, so it needs to read. Nobody should write to the
  emergency trip system over the network.

  Reads are function codes 1, 2, 3, 4 and 43. Writes are 5, 6, 15 and 16.
setup:
  - zone create enterprise --sl 1
  - zone create dmz --sl 2
  - zone create operations --sl 2
  - zone create control --sl 3
  - zone create safety --sl 3
  - zone set ${control-centre.zone} --sl 2
  - zone add enterprise ${office}
  - zone add dmz ${report-server} ${jump}
  - zone add operations ${historian}
  - zone add control ${hmi} ${ews} ${plc} ${tvs}
  - zone add safety ${sis}
  - zone delete ${plc.zone}
  - conduit create ops-control operations control
  - fw allow ops-control from ${historian} to ${plc} modbus
  - fw allow ops-control from ${historian} to ${tvs} modbus
  - conduit create ops-safety operations safety
  - fw allow ops-safety from ${historian} to ${sis} modbus
  - conduit create control-safety control safety
  - fw allow control-safety from ${hmi} to ${sis} modbus
  - conduit create wan-control ${control-centre.zone} control
  - fw allow wan-control from ${control-centre} to ${plc} modbus
  - fw allow wan-control from ${control-centre} to ${tvs} modbus
  - fw allow wan-control from ${backup-centre} to ${plc} modbus
  - conduit create wan-safety ${control-centre.zone} safety
  - fw allow wan-safety from ${control-centre} to ${sis} modbus
  - conduit create ops-dmz operations dmz
  - fw allow ops-dmz from ${historian} to ${report-server} https
  - conduit create ent-dmz enterprise dmz
  - fw allow ent-dmz from ${office} to ${report-server} https
tasks:
  - "See the problem: `test ${backup-centre} ${plc} modbus fc 5`. That is the feeder breaker, switchable from a standby server 12 km away."
  - Limit the historian to function codes 3 and 4 towards ${plc} and ${tvs}, and 2 and 4 towards ${sis}. Limit ${hmi} to reads on ${sis}.
  - Limit the OCC to function codes 3, 4, 5 and 6 on ${plc} and ${tvs}, and to 2 and 4 on ${sis}. Limit the backup OCC to 3 and 4 on ${plc}.
  - "Prove it: from the backup OCC, try `modbus write ${plc} coil ${plc:feeder.command} 0`. It should time out. Then find it in `fw log`."
checks:
  - name: The backup OCC cannot switch the feeder
    flow: { from: "${backup-centre}", to: "${plc}", service: modbus, fc: 5, expect: blocked }
  - name: The OCC cannot send multiple-register writes to ${plc}
    flow: { from: "${control-centre}", to: "${plc}", service: modbus, fc: 16, expect: blocked }
  - name: The OCC still runs the traction power
    required: occ-plc
  - name: The OCC still reaches the tunnel ventilation
    required: occ-tvs
  - name: The backup OCC still keeps its live copy
    required: bocc-plc
  - name: The OCC still sees the emergency trip status
    required: occ-sis
  - name: The control room still reads ${sis}
    required: hmi-sis
  - name: No host can write to the safety system
    risk: sis-read-only
  - name: The historian can only read
    risk: historian-read-only
  - name: You tried the feeder write from the backup OCC and the firewall blocked it
    command: fw log
    outputMatches: '${backup-centre}\s+${plc}\s+modbus fc (5|6|15|16)'
hints:
  - "`fw list wan-control` shows the rule numbers. Delete the rules (`fw delete wan-control 1` three times), then add narrow ones."
  - "`fw allow wan-control from ${control-centre} to ${plc} modbus fc 3,4,5,6` and `fw allow wan-control from ${backup-centre} to ${plc} modbus fc 3,4`. On wan-safety, the OCC gets `fc 2,4`."
  - "`fc read` is shorthand for 1,2,3,4,43. `ssh ${backup-centre} modbus write ${plc} coil ${plc:feeder.command} 0` should then time out."
solution:
  - fw delete ops-control 1
  - fw delete ops-control 1
  - fw allow ops-control from ${historian} to ${plc} modbus fc 3,4
  - fw allow ops-control from ${historian} to ${tvs} modbus fc 3,4
  - fw delete ops-safety 1
  - fw allow ops-safety from ${historian} to ${sis} modbus fc 2,4
  - fw delete control-safety 1
  - fw allow control-safety from ${hmi} to ${sis} modbus fc read
  - fw delete wan-control 1
  - fw delete wan-control 1
  - fw delete wan-control 1
  - fw allow wan-control from ${control-centre} to ${plc} modbus fc 3,4,5,6
  - fw allow wan-control from ${control-centre} to ${tvs} modbus fc 3,4,5,6
  - fw allow wan-control from ${backup-centre} to ${plc} modbus fc 3,4
  - fw delete wan-safety 1
  - fw allow wan-safety from ${control-centre} to ${sis} modbus fc 2,4
  - "ssh ${backup-centre} modbus write ${plc} coil ${plc:feeder.command} 0   # times out, as it should"
learned: |
  Function code filtering cannot tell a good command from a bad one, but it
  removes whole classes of harm: the OCC still runs the line, yet the
  standby server can no longer switch anything and nobody can reprogram a
  controller across the WAN. When the OCC hands control to the backup OCC,
  the firewall team swaps one rule, as part of the takeover procedure.
refs:
  - IEC 62443-3-3 SR 5.2 (zone boundary protection)
  - CLC/TS 50701 (railway applications, cybersecurity)
