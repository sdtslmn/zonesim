id: g08-remote-access
site: gas-compressor-station
title: Compressor maker support through a jump host
level: intermediate
minutes: 12
topic: Remote access
intro: |
  The compressor maker supports the station with remote desktop straight from
  the internet into the engineering workstation in the control zone. If the
  maker's laptop or password is compromised, the attacker lands next to the
  unit PLC.

  Route the maker's logins through ${jump} in the DMZ, with multi-factor
  authentication there. Its performance reports already come from
  ${report-server}. You also play the maker to test the path: `ssh ${vendor}`,
  then `rdp ...`.
setup:
  - zone create enterprise --sl 1
  - zone create dmz --sl 2
  - zone create operations --sl 2
  - zone create control --sl 3
  - zone create safety --sl 3
  - zone set ${control-centre.zone} --sl 2
  - zone add enterprise ${office}
  - zone add dmz ${report-server} ${jump}
  - zone add operations ${historian}
  - zone add control ${hmi} ${ews} ${plc} ${meter}
  - zone add safety ${sis}
  - zone delete ${plc.zone}
  - conduit create ops-control operations control
  - fw allow ops-control from ${historian} to ${plc} modbus fc 3,4
  - fw allow ops-control from ${historian} to ${meter} modbus fc 3,4
  - conduit create ops-safety operations safety
  - fw allow ops-safety from ${historian} to ${sis} modbus fc 2,4
  - conduit create control-safety control safety
  - fw allow control-safety from ${hmi} to ${sis} modbus fc read
  - conduit create wan-control ${control-centre.zone} control
  - fw allow wan-control from ${control-centre} to ${plc} modbus fc 3,4,5,6
  - fw allow wan-control from ${control-centre} to ${meter} modbus fc 3,4
  - conduit create ops-dmz operations dmz
  - fw allow ops-dmz from ${historian} to ${report-server} https
  - conduit create ent-dmz enterprise dmz
  - fw allow ent-dmz from ${office} to ${report-server} https
  - conduit create inet-dmz ${vendor.zone} dmz
  - fw allow inet-dmz from ${vendor} to ${report-server} https
  - conduit create inet-control ${vendor.zone} control
  - fw allow inet-control from ${vendor} to ${ews} rdp
tasks:
  - "See the current path: `fw list inet-control`. Try it as the maker with `ssh ${vendor} rdp ${ews}`, then look at `alerts`."
  - Let ${vendor} reach ${jump} over rdp. The conduit inet-dmz already exists.
  - Let ${jump} reach ${ews} over rdp (dmz to control).
  - "Turn on MFA on ${jump}: `host config ${jump} mfa=on`."
  - Remove the direct path by deleting conduit inet-control.
checks:
  - name: The maker still reaches ${ews}, through ${jump}
    required: vendor-support
  - name: The maker cannot reach ${ews} directly
    flow: { from: "${vendor}", to: "${ews}", service: rdp, expect: blocked }
  - name: MFA is on at ${jump}
    host: { name: "${jump}", mfa: true }
  - name: The maker's reports still work
    required: oem-monitoring
  - name: The internet only reaches the DMZ
    risk: internet-dmz-only
  - name: Remote access passes the design review
    risk: remote-access
hints:
  - "`fw allow inet-dmz from ${vendor} to ${jump} rdp`."
  - "`conduit create dmz-control dmz control`, then `fw allow dmz-control from ${jump} to ${ews} rdp`."
  - "`conduit delete inet-control` removes the direct path."
solution:
  - fw allow inet-dmz from ${vendor} to ${jump} rdp
  - conduit create dmz-control dmz control
  - fw allow dmz-control from ${jump} to ${ews} rdp
  - host config ${jump} mfa=on
  - conduit delete inet-control
learned: |
  Machine makers often hold standing remote access to their equipment, and
  it is a well-trodden way into industrial sites. Ending it in the DMZ, behind
  a second factor and a separate session, gives you one place to approve,
  record and cut those sessions. Data the maker needs for monitoring comes
  from the DMZ copy, not from the plant.
refs:
  - IEC 62443-3-3 SR 1.13 (access via untrusted networks)
  - IEC 62443-3-3 SR 1.1 RE 2 (multifactor authentication for untrusted networks)
