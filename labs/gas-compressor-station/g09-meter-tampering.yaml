id: g09-meter-tampering
site: gas-compressor-station
title: The gas bill does not add up
level: advanced
minutes: 15
topic: Incident response
intro: |
  Monday, 08:15. Gas accounting at the control centre says the station has
  billed its customers about 5 % more gas than usual since the weekend, with
  the same demand. The process looks normal. The IDS raised alerts on
  Saturday night. The network is still flat.

  Find out what changed, put it right, and stop it from happening again
  without stopping the station.
setup:
  - ssh ${office} nmap -p 502 ${plc.net}
  - ssh ${office} modbus info ${meter}
  - ssh ${office} modbus write ${meter} hr ${meter:meter.factor} 10500
settle: 120
tasks:
  - Compare the station flow measured by ${plc} with the flow measured by the flow computer ${meter}. `plant` shows both, or read them over Modbus.
  - "Find the setting that makes them differ: `modbus map ${meter}` lists its registers."
  - Read the alerts. Which host wrote to the flow computer? Write its name into attacker.txt.
  - Restore the meter factor to 1.0000 (raw 10000) from the engineering workstation, the only host that should ever write to the flow computer.
  - "Contain it: that host must no longer reach ${meter} or ${plc} over Modbus, while every station data flow keeps working. A full zone design can wait."
  - Acknowledge the alerts once they are handled.
checks:
  - name: attacker.txt names the source of the write
    file: { path: attacker.txt, matches: '${office}|${office.ip}' }
  - name: The meter factor is back to 1.0000
    register: { host: "${meter}", signal: meter.factor, equals: 10000 }
  - name: The source host can no longer write to the flow computer
    flow: { from: "${office}", to: "${meter}", service: modbus, fc: 6, expect: blocked }
  - name: The source host can no longer write to ${plc}
    flow: { from: "${office}", to: "${plc}", service: modbus, fc: 6, expect: blocked }
  - name: Every station data flow still works
    required: all
  - name: The alert for the write is acknowledged
    alert: { title: Unauthorized Modbus write, src: "${office}", acked: true }
hints:
  - "`plant` shows the station flow and the flow computer side by side, with the meter factor. One of them is 5 % high."
  - "`alerts show ID` gives the source IP, and `hosts | grep ${office.ip}` turns it into a name. Restore with `ssh ${ews} modbus write ${meter} hr ${meter:meter.factor} 10000`."
  - "Put ${office} in a zone of its own, then connect it to ${plc.zone} with one rule: ${office} to ${report-server} https."
solution:
  - alerts
  - echo ${office} > attacker.txt
  - ssh ${ews} modbus write ${meter} hr ${meter:meter.factor} 10000
  - zone create enterprise --sl 1
  - zone add enterprise ${office}
  - conduit create ent-station enterprise ${plc.zone}
  - fw allow ent-station from ${office} to ${report-server} https
  - alerts ack all
learned: |
  Not every attack on OT is about physical damage. One holding register on
  the flow computer changed what customers were billed, while every pressure
  and alarm looked normal. Two independent measurements of the same gas gave
  it away. Fiscal meters deserve write protection, a short list of hosts
  that may calibrate them, and an audit trail of every change.
refs:
  - API MPMS Chapter 21.1 (electronic gas measurement, audit trail)
  - NIST SP 800-61 (incident handling)
  - MITRE ATT&CK for ICS T0836 (modify parameter)
