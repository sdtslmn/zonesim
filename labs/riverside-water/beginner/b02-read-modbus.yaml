id: b02-read-modbus
site: riverside-water
title: Read the process over Modbus
level: beginner
minutes: 10
topic: Modbus basics
intro: |
  The HMI shows the tank level because it polls ${plc} over Modbus TCP every
  few seconds. Modbus keeps data in four tables: coils (on/off outputs),
  discrete inputs (on/off inputs), input registers (measurements) and holding
  registers (settings). Values are plain 16-bit numbers, so the vendor manual
  tells you how to scale them.

  In this lab you read the process the same way the HMI does.
tasks:
  - "Read the PLC's register map from the vendor manual: `modbus map ${plc}`. This sends no traffic."
  - "Log in to the HMI host: `ssh ${hmi}`."
  - "Read the tank level, input register ${plc:level}: `modbus read ${plc} ir ${plc:level}`. Then read the chlorine residual, input register ${plc:chlorine}."
  - Read the pump start and stop levels, holding registers ${plc:setpoint.start} and ${plc:setpoint.stop}.
  - Type `exit` to go back to the console, and write the pump stop level as a percentage into stop-level.txt. The raw value is in tenths of a percent.
checks:
  - name: The holding registers were read from ${hmi} (function code 3)
    command: flows --mine
    outputMatches: '${hmi}\s+${plc}\s+modbus\s+\S*\b3\b'
  - name: stop-level.txt holds the stop level in percent
    file: { path: stop-level.txt, matches: '^\s*${param.stopLevel}(\.0+)?\s*%?\s*$' }
hints:
  - "`modbus read ${plc} hr ${plc:setpoint.stop}` reads holding register ${plc:setpoint.stop}. Add a count after the address to read several registers in a row."
  - "A raw value of ${param.stopLevel*10} in tenths of a percent is ${param.stopLevel} %. Write it with `echo ${param.stopLevel} > stop-level.txt`."
solution:
  - ssh ${hmi} modbus read ${plc} ir ${plc:level}
  - ssh ${hmi} modbus read ${plc} ir ${plc:chlorine}
  - ssh ${hmi} modbus read ${plc} hr ${plc:setpoint.start}
  - ssh ${hmi} modbus read ${plc} hr ${plc:setpoint.stop}
  - echo ${param.stopLevel} > stop-level.txt
learned: |
  Function code 3 reads holding registers and function code 4 reads input
  registers. The values are scaled integers, which is why register maps
  matter to defenders and attackers alike. There was no login: any host that
  can reach port 502 on the PLC can read the whole process.
refs:
  - Modbus Application Protocol Specification v1.1b3
