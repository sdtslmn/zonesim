id: a01-investigate-alert
site: riverside-water
title: Investigate an unauthorized write
level: advanced
minutes: 15
topic: Incident response
intro: |
  Monday, 06:40. The night shift reports a low chlorine alarm, and the IDS
  raised several alerts overnight. The network is still flat.

  Find out what happened, put the process right, and stop it from happening
  again, without breaking the plant.
setup:
  - ssh ${office} nmap -p 502 ${plc.net}
  - ssh ${office} modbus info ${plc}
  - ssh ${office} modbus write ${plc} hr ${plc:setpoint.chlorine} 0
settle: 120
tasks:
  - Read the alerts with `alerts` and `alerts show ID`. Which IP address did the write come from, and which host is that?
  - Write the name of that host into attacker.txt.
  - Find which value was changed and restore it from the HMI. The normal chlorine setpoint is ${param.chlorineSetpoint} mg/L. `modbus map ${plc}` helps.
  - "Contain it: that host must no longer reach ${plc} over Modbus, while every plant data flow keeps working. You do not need a full zone design for this."
  - Acknowledge the alerts once they are handled.
checks:
  - name: attacker.txt names the source of the write
    file: { path: attacker.txt, matches: '${office}|${office.ip}' }
  - name: The chlorine setpoint is back to ${param.chlorineSetpoint} mg/L (${plc} hr ${plc:setpoint.chlorine} = ${param.chlorineSetpoint*100})
    register: { host: "${plc}", signal: setpoint.chlorine, equals: "${param.chlorineSetpoint*100}" }
  - name: The source host can no longer write to ${plc}
    flow: { from: "${office}", to: "${plc}", service: modbus, fc: 6, expect: blocked }
  - name: Every plant data flow still works
    required: all
  - name: The alert for the write is acknowledged
    alert: { title: Unauthorized Modbus write, src: "${office}", acked: true }
hints:
  - "`alerts show` gives the source IP. `hosts | grep ${office.ip}` turns it into a name."
  - "The write hit holding register ${plc:setpoint.chlorine}, the chlorine setpoint. The raw value is in hundredths of mg/L. Restore it with `ssh ${hmi} modbus write ${plc} hr ${plc:setpoint.chlorine} ${param.chlorineSetpoint*100}`."
  - "Put ${office} in a zone of its own. Then office reports need a conduit to ${plc.zone} with one rule: ${office} to ${report-server} https."
solution:
  - alerts
  - echo ${office} > attacker.txt
  - ssh ${hmi} modbus write ${plc} hr ${plc:setpoint.chlorine} ${param.chlorineSetpoint*100}
  - zone create enterprise --sl 1
  - zone add enterprise ${office}
  - conduit create ent-site enterprise ${plc.zone}
  - fw allow ent-site from ${office} to ${report-server} https
  - alerts ack all
learned: |
  A typical first response: identify the source from the detection, restore
  the process from a trusted station, contain the source with segmentation
  without stopping the plant, then acknowledge and write it up. Note the
  attacker's path in the alerts: a scan for port 502, a device
  identification read, then the write. Reconnaissance usually comes first,
  and catching it early buys time.
refs:
  - NIST SP 800-61 (incident handling)
  - MITRE ATT&CK for ICS T0846 (remote system discovery), T0855 (unauthorized command message)
