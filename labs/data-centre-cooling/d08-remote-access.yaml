id: d08-remote-access
site: data-centre-cooling
title: Chiller vendor support through a jump host
level: intermediate
minutes: 12
topic: Remote access
intro: |
  The chiller vendor supports the plant with remote desktop straight from the
  internet into the BMS workstation. If the vendor's laptop or password is
  compromised, the attacker sits at the BMS with full control of the cooling.

  Route the vendor's logins through ${jump} in the DMZ, with multi-factor
  authentication there. You also play the vendor to test the path:
  `ssh ${vendor}`, then `rdp ...`.
setup:
  - zone create enterprise --sl 1
  - zone create dmz --sl 2
  - zone create operations --sl 2
  - zone create control --sl 3
  - zone create power --sl 2
  - zone create safety --sl 3
  - zone add enterprise ${office}
  - zone add dmz ${report-server} ${jump}
  - zone add operations ${historian}
  - zone add control ${hmi} ${ews} ${plc}
  - zone add power ${meter}
  - zone add safety ${sis}
  - zone delete ${plc.zone}
  - conduit create ops-control operations control
  - fw allow ops-control from ${historian} to ${plc} modbus fc 3,4
  - conduit create ops-power operations power
  - fw allow ops-power from ${historian} to ${meter} modbus fc 3,4
  - conduit create ops-safety operations safety
  - fw allow ops-safety from ${historian} to ${sis} modbus fc 2,4
  - conduit create control-power control power
  - fw allow control-power from ${hmi} to ${meter} modbus fc read
  - conduit create control-safety control safety
  - fw allow control-safety from ${hmi} to ${sis} modbus fc read
  - conduit create ops-dmz operations dmz
  - fw allow ops-dmz from ${historian} to ${report-server} https
  - conduit create ent-dmz enterprise dmz
  - fw allow ent-dmz from ${office} to ${report-server} https
  - conduit create inet-dmz ${vendor.zone} dmz
  - fw allow inet-dmz from ${customer} to ${report-server} https
  - conduit create inet-control ${vendor.zone} control
  - fw allow inet-control from ${vendor} to ${hmi} rdp
tasks:
  - "See the current path: `fw list inet-control`. Try it as the vendor with `ssh ${vendor} rdp ${hmi}`, then look at `alerts`."
  - Let ${vendor} reach ${jump} over rdp. The conduit inet-dmz already exists for the customers.
  - Let ${jump} reach ${hmi} over rdp (dmz to control).
  - "Turn on MFA on ${jump}: `host config ${jump} mfa=on`."
  - Remove the direct path by deleting conduit inet-control.
checks:
  - name: The vendor still reaches ${hmi}, through ${jump}
    required: vendor-support
  - name: The vendor cannot reach ${hmi} directly
    flow: { from: "${vendor}", to: "${hmi}", service: rdp, expect: blocked }
  - name: MFA is on at ${jump}
    host: { name: "${jump}", mfa: true }
  - name: Customers still read the portal
    required: customer-portal
  - name: The internet only reaches the DMZ
    risk: internet-dmz-only
  - name: Remote access passes the design review
    risk: remote-access
hints:
  - "`fw allow inet-dmz from ${vendor} to ${jump} rdp`."
  - "`conduit create dmz-control dmz control`, then `fw allow dmz-control from ${jump} to ${hmi} rdp`."
  - "`conduit delete inet-control` removes the direct path."
solution:
  - fw allow inet-dmz from ${vendor} to ${jump} rdp
  - conduit create dmz-control dmz control
  - fw allow dmz-control from ${jump} to ${hmi} rdp
  - host config ${jump} mfa=on
  - conduit delete inet-control
learned: |
  Building and facility systems reachable from the internet are found in
  large numbers by every internet scan, often with vendor accounts that
  never expire. Ending remote access in the DMZ, behind a second factor,
  gives you one place to approve, record and cut vendor sessions.
refs:
  - IEC 62443-3-3 SR 1.13 (access via untrusted networks)
  - IEC 62443-3-3 SR 1.1 RE 2 (multifactor authentication for untrusted networks)
