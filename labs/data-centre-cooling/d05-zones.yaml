id: d05-zones
site: data-centre-cooling
title: Group the facility systems into zones
level: intermediate
minutes: 12
topic: Zones
intro: |
  Group the hosts into zones by what they do and how much you trust them:
  office, DMZ, operations (the DCIM), control (the BMS and the chiller plant
  controller), power monitoring, and life safety for the fire panel. Power
  monitoring often belongs to a different team and contract from cooling, so
  it gets its own zone here.

  Each zone gets a target security level (SL-T, 1 to 4) from the risk
  assessment.
tasks:
  - "Create the zones: enterprise (SL-T 1), dmz (SL-T 2), operations (SL-T 2), control (SL-T 3), power (SL-T 2) and safety (SL-T 3), for example `zone create control --sl 3`."
  - "Move the hosts: ${office} to enterprise; ${report-server} and ${jump} to dmz; ${historian} to operations; ${hmi}, ${ews} and ${plc} to control; ${meter} to power; ${sis} to safety."
  - Delete the flat zone, ${plc.zone}, once it is empty.
  - Run `plant`. Most data flows are blocked now, because nothing connects the zones yet. The next lab adds conduits.
checks:
  - name: ${office} is in an office zone without facility hosts
    zone: { host: "${office}", notWith: ["${report-server}", "${historian}", "${hmi}", "${plc}", "${sis}", "${meter}"] }
  - name: ${report-server} and ${jump} share a DMZ zone
    zone: { host: "${report-server}", with: ["${jump}"], notWith: ["${office}", "${historian}", "${plc}"] }
  - name: ${historian} has an operations zone of its own
    zone: { host: "${historian}", notWith: ["${office}", "${report-server}", "${hmi}", "${plc}", "${sis}", "${meter}"] }
  - name: ${hmi}, ${ews} and ${plc} share a control zone with SL-T 3 or more
    zone: { host: "${plc}", with: ["${hmi}", "${ews}"], notWith: ["${historian}", "${sis}", "${meter}"], slAtLeast: 3 }
  - name: ${meter} has a power monitoring zone of its own
    zone: { host: "${meter}", alone: true }
  - name: ${sis} is alone in the safety zone, with SL-T 3 or more
    zone: { host: "${sis}", alone: true, slAtLeast: 3 }
  - name: The flat zone ${plc.zone} is gone
    command: zone list
    outputNotMatches: '^${plc.zone}\b'
  - name: Office, DMZ and plant hosts are in separate zones
    risk: segmented
hints:
  - "`zone create enterprise --sl 1`, then `zone add enterprise ${office}`."
  - "`zone add` takes several hosts at once: `zone add control ${hmi} ${ews} ${plc}`."
  - "`zone delete ${plc.zone}` works once the zone is empty. Deleting it also removes the old conduit to it."
solution:
  - zone create enterprise --sl 1
  - zone create dmz --sl 2
  - zone create operations --sl 2
  - zone create control --sl 3
  - zone create power --sl 2
  - zone create safety --sl 3
  - zone add enterprise ${office}
  - zone add dmz ${report-server} ${jump}
  - zone add operations ${historian}
  - zone add control ${hmi} ${ews} ${plc}
  - zone add power ${meter}
  - zone add safety ${sis}
  - zone delete ${plc.zone}
learned: |
  The fire panel gets a zone of its own because it is life safety
  equipment: nothing on the network should be able to stop it, or set it off.
  Separating power monitoring keeps a problem in one contractor's system from
  reaching the cooling, and the other way round.
refs:
  - IEC 62443-3-2 ZCR 3 (partition into zones and conduits)
  - NFPA 72 (fire alarm systems, interfaces to other systems)
