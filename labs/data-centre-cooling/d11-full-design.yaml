id: d11-full-design
site: data-centre-cooling
title: Segment the whole facility from scratch
level: scenario
minutes: 25
topic: Zones and conduits
intro: |
  Final challenge for this data centre. Starting from the flat network as
  found, design the zones and conduits for the facility systems: cooling,
  power monitoring, life safety, the DCIM, the customer portal and the
  vendor's access. The hall must stay cool and the design review must pass
  every check.

  No step-by-step help this time. `report` tells you where you stand, and
  `test` checks a single flow before you rely on it.
tasks:
  - Run `report`. Every data flow works and most security checks fail.
  - Design zones for the office, the DMZ, operations, control, power monitoring and life safety.
  - Add conduits with least-privilege rules, and make monitoring read-only.
  - Route the chiller vendor's logins through ${jump}, with MFA.
  - Finish when `report` shows every data flow and every security check passing, the safety zone has SL-T 3 or more, and the BMS cannot write to the fire panel.
checks:
  - name: Every facility data flow works
    required: all
  - name: Every security check in the report passes
    risk: all
  - name: The safety zone has SL-T 3 or more
    zone: { host: "${sis}", slAtLeast: 3 }
  - name: The BMS cannot write to the fire panel
    flow: { from: "${hmi}", to: "${sis}", service: modbus, fc: 5, expect: blocked }
hints:
  - "Start with the zones from lab D05, then conduits as in D06 with the filters from D07, and remote access as in D08."
  - "Deleting the flat zone ${plc.zone} also removes the old edge conduit, with the direct vendor path and the customers' access, so add the customers back."
  - "`report` shows the first problem for each failing check, and `test SRC DST SERVICE [fc N]` checks one flow."
solution:
  - zone create enterprise --sl 1
  - zone create dmz --sl 2
  - zone create operations --sl 2
  - zone create control --sl 3
  - zone create power --sl 2
  - zone create safety --sl 3
  - zone add enterprise ${office}
  - zone add dmz ${report-server} ${jump}
  - zone add operations ${historian}
  - zone add control ${hmi} ${ews} ${plc}
  - zone add power ${meter}
  - zone add safety ${sis}
  - zone delete ${plc.zone}
  - conduit create ops-control operations control
  - fw allow ops-control from ${historian} to ${plc} modbus fc 3,4
  - conduit create ops-power operations power
  - fw allow ops-power from ${historian} to ${meter} modbus fc 3,4
  - conduit create ops-safety operations safety
  - fw allow ops-safety from ${historian} to ${sis} modbus fc 2,4
  - conduit create control-power control power
  - fw allow control-power from ${hmi} to ${meter} modbus fc read
  - conduit create control-safety control safety
  - fw allow control-safety from ${hmi} to ${sis} modbus fc read
  - conduit create ops-dmz operations dmz
  - fw allow ops-dmz from ${historian} to ${report-server} https
  - conduit create ent-dmz enterprise dmz
  - fw allow ent-dmz from ${office} to ${report-server} https
  - conduit create inet-dmz ${vendor.zone} dmz
  - fw allow inet-dmz from ${customer} to ${report-server} https
  - fw allow inet-dmz from ${vendor} to ${jump} rdp
  - conduit create dmz-control dmz control
  - fw allow dmz-control from ${jump} to ${hmi} rdp
  - host config ${jump} mfa=on
learned: |
  That is a complete design for a data hall's facility systems: an office
  and a customer portal that never touch the controllers, a DCIM that reads
  but cannot write, power monitoring and life safety in zones of their own,
  and vendor access through one controlled door. The same thinking applies
  to every hall and every site in a data centre estate.
refs:
  - IEC 62443-3-2 (security risk assessment for system design)
  - ANSI/TIA-942 (data center infrastructure)
